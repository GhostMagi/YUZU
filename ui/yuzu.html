<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yuzu</title>
<!--
  YUZU — the gyaru, with a body she can be dressed in.

  Ghost, Sept 11: "Yuzu. let her be able to 'switch outfits' and also if
  she doesnt already think she has a virtual body or body let that be a
  thing. (in case i wana paint her nails she wouldnt just be like 'ima
  computer') same treatment as Cait."

  Built on cait.html's shape on purpose — a portrait card, a breath, a
  light that rises while she is thinking, a rail, and one way home. The
  two things that are hers and not Cait's are the palette and the
  wardrobe.

  HER PALETTE IS SAMPLED OFF HER OWN PNGs. Warm skin and cream
  (#f0d0c0 / #f0e0d0, the two most common colours in her), her blonde
  (#e8c98f), and the cool slate of the zebra fit's jacket and leg
  warmers (#505060 / #303040). The one colour that is NOT sampled is
  the hot pink: that is character, it lives in her persona files, and
  CLAUDE.md is explicit that the no-chassis-colours rule is about the
  CASE and never about her taste.

  Not the deck's green-on-black — same call as cait.html and vpet.html.
  The CRT look is locked to the deck screens on purpose.

  THE WARDROBE IS DATA, NOT CODE. /outfits.json is generated per
  request from whatever PNGs are sitting in ui/yuzu/, so a new outfit
  is a file dropped in that folder and nothing else — the same rule as
  "a folder is a character" and "the filename is the expression". No
  list lives in this page and none lives in her prompt.

  No network, no fonts, no libraries.
-->
<style>
:root {
  --night:  #241a26;          /* dusky plum, warm enough to hold her   */
  --deep:   #150e17;
  --dusk:   #3a2b3d;
  --edge:   #5a4560;
  --ink:    #f6e9e2;          /* cream, off her own skin highlights    */
  --dim:    #c3a9bd;
  --pink:   #ff5fa8;          /* character. Hers. Not sampled.         */
  --blonde: #e8c98f;
  --slate:  #505060;          /* the jacket and the leg warmers        */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100vh; overflow: hidden; }
body {
  background:
    radial-gradient(120% 90% at 50% 6%, #3a2740 0%, var(--night) 46%,
                    var(--deep) 100%);
  color: var(--ink);
  font: 16px/1.5 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  display: flex; flex-direction: column;
}

/* ---- the room ------------------------------------------------------
   A pink hairline and two corner flourishes, same furniture as Cait's
   hall in her own colour. Thin, because the picture is the loud thing
   on this screen. */
#room {
  position: fixed; inset: 10px; pointer-events: none;
  border: 1px solid color-mix(in srgb, var(--pink) 26%, transparent);
  border-radius: 3px;
}
#room::before, #room::after {
  content: ''; position: absolute; width: 26px; height: 26px;
  border: 2px solid color-mix(in srgb, var(--pink) 55%, transparent);
}
#room::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
#room::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

/* ---- top ---------------------------------------------------------- */
#top {
  display: flex; align-items: center; gap: 12px;
  padding: 18px 26px 4px;
}
#who { font-size: 21px; letter-spacing: .08em; color: var(--pink);
       font-weight: 700; }
#title { font-size: 12.5px; color: var(--dim); letter-spacing: .04em; }

/* ---- the rail ------------------------------------------------------
   Built from /characters.json, which comes from ONE roster in
   yuzu_face.py, so no page holds a list of the cast and none can
   drift. Always visible rather than a menu: a menu is a mode, and a
   mode needs a way out. */
#rail { display: flex; gap: 6px; margin-left: 18px; }
#rail a, #rail span {
  font-size: 12.5px; letter-spacing: .05em; text-decoration: none;
  padding: 4px 11px; border-radius: 2px;
  color: var(--dim); border: 1px solid transparent;
}
#rail a { cursor: pointer; }
#rail a:hover { color: var(--ink); border-color: var(--edge); }
#rail .here {
  color: var(--pink);
  border-color: color-mix(in srgb, var(--pink) 40%, transparent);
  background: rgba(0,0,0,.3);
}

/* ---- the wardrobe --------------------------------------------------
   THE BUTTON NAMES THE OUTFIT IT WILL PUT HER IN, not the one she has
   on — same reasoning as the V-Pet's swap button and the old colour
   dot: what she is wearing right now is standing in the middle of the
   screen. A button that labels the obvious tells you nothing.

   It is ABSENT rather than broken when there is only one outfit, and
   absent when /outfits.json cannot be reached. Same call sprites()
   makes about a missing folder and the rail makes about a missing
   roster: a broken extra must never take the character down with it. */
#fit {
  margin-left: auto; display: none; align-items: center; gap: 7px;
  font: inherit; font-size: 12.5px; letter-spacing: .05em; cursor: pointer;
  color: var(--blonde); background: rgba(0,0,0,.25);
  border: 1px solid color-mix(in srgb, var(--blonde) 35%, transparent);
  border-radius: 2px; padding: 6px 13px;
}
#fit.on { display: inline-flex; }
#fit:hover { color: var(--ink); border-color: var(--blonde); }
#fit .hanger { font-size: 14px; opacity: .85; }
#home {
  width: 38px; height: 38px; flex: none;
  border-radius: 50%; cursor: pointer; display: grid; place-items: center;
  font-size: 17px; color: var(--pink); background: rgba(0,0,0,.25);
  border: 1px solid color-mix(in srgb, var(--pink) 35%, transparent);
}
#fit + #home { margin-left: 10px; }
#top > #home:first-of-type { margin-left: auto; }

/* ---- her ----------------------------------------------------------- */
/* SHE STANDS ON THE RIGHT, HER WORDS GO ON THE LEFT. Rendering Cait
   is what found this: a bubble at left:4% width:46% ends exactly at
   the middle of the screen, which is exactly where a centred character
   stands. */
#stage {
  flex: 1; min-height: 0; position: relative; overflow: hidden;
  /* SHE STANDS ON THE FLOOR of the stage, not hung from the ceiling.
     Cait uses `start` because she is deliberately cropped; Yuzu is
     not, and the breath needs its headroom at the TOP (see below). */
  display: grid; align-items: end; justify-items: end;
  padding-right: 4%;
  /* minmax(0, 1fr) IS LOAD-BEARING. A grid row is `auto` by default,
     so it grows to fit the image and a percentage height has nothing
     bounded to resolve against — measured on Cait's page as a 779px
     image inside a 460px stage, painting over the ask bar. */
  grid-template-rows: minmax(0, 1fr);
}
/* THE LIGHT IS THE "SHE IS THINKING" CUE. It sits BEHIND her and rises
   while a reply is coming — the honest loading spinner, in her idiom
   (pink and quick) rather than Cait's slow ember. */
#glow {
  position: absolute; left: 50%; bottom: 2%; transform: translateX(-50%);
  width: 62%; height: 78%; border-radius: 50%;
  background: radial-gradient(circle,
              color-mix(in srgb, var(--pink) 26%, transparent) 0%,
              transparent 68%);
  opacity: .22; transition: opacity .6s ease;
}
body.thinking #glow { animation: sparkle 1.7s ease-in-out infinite; }
@keyframes sparkle {
  0%, 100% { opacity: .28 }
  50%      { opacity: .8 }
}
/* SHE IS SHOWN WHOLE, AND THAT IS THE ONE PLACE THIS PAGE REFUSES TO
   COPY CAIT'S. Cait is deliberately cropped at the shins: her picture
   is a pose, nothing below the knee carries information, and letting
   her overrun buys size for free.

   Yuzu's picture is an OUTFIT, and the most legible difference between
   her two looks is at the bottom of it -- grey fur boots and leg
   warmers against white knee socks. Cropping her at the shins would
   hide the exact thing the wardrobe button exists to show. Measured:
   at Cait's 136% she cuts just above the leg warmers.

   So she fills the stage's height and no more. She reads smaller than
   Cait for a real reason -- she is a whole standing figure and Cait is
   a pose from the knee up -- and the left half of the screen, which is
   hers to talk in, is not wasted by it.

   96%, not 100%: the breath below scales her 1.8% and needs somewhere
   to go, and `overflow: hidden` on the stage would shave her hair off
   the top on every cycle. */
#yuzu {
  height: 96%; max-width: 46%;
  object-fit: contain; object-position: bottom center;
  filter: drop-shadow(0 10px 26px rgba(0,0,0,.6));
  animation: breathe 5s ease-in-out infinite;
  position: relative; cursor: pointer;
  transform-origin: bottom center;
}
/* A 2% pulse, from the FEET. Scaling about the default centre grows
   her downward as well as up, so her shins crawl under the ask bar on
   every breath. She is standing on a floor; she breathes upward. */
@keyframes breathe {
  0%, 100% { transform: scale(1)      translateY(0) }
  50%      { transform: scale(1.018)  translateY(-3px) }
}
/* The change of clothes is a quick fade rather than a hard cut, so a
   tap reads as HER changing rather than as the page reloading. */
#yuzu.changing { opacity: 0; transition: opacity .16s linear; }

/* ---- what she says -------------------------------------------------- */
#says {
  position: absolute; left: 4%; bottom: 7%; width: 42%; max-height: 72%;
  overflow-y: auto; display: none;
  background: rgba(20,12,22,.9);
  border: 1px solid color-mix(in srgb, var(--pink) 30%, transparent);
  border-left: 3px solid var(--pink);
  border-radius: 3px; padding: 16px 18px;
  font-size: 17px; line-height: 1.55;
}
#says.on { display: block; }
#says::after {                       /* a small tail toward her */
  content: ''; position: absolute; right: -9px; top: 26px;
  border: 8px solid transparent;
  border-left-color: color-mix(in srgb, var(--pink) 30%, transparent);
}

/* ---- asking --------------------------------------------------------- */
#ask {
  /* ABOVE HER, ALWAYS. #yuzu is positioned, and a positioned element
     paints above static siblings whatever the DOM order — so without
     this she covers her own Speak button. */
  position: relative; z-index: 2;
  background: linear-gradient(to top, var(--deep) 62%, transparent);
  display: flex; gap: 10px; align-items: center;
  padding: 10px 26px calc(20px + env(safe-area-inset-bottom));
}
#text {
  flex: 1; font: inherit; font-size: 16px; color: var(--ink);
  background: rgba(0,0,0,.32); padding: 12px 15px; border-radius: 3px;
  border: 1px solid var(--edge);
}
#text::placeholder { color: var(--dim); opacity: .8; }
#text:focus { outline: none; border-color: var(--pink); }
#send {
  font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
  color: #2a0a1a; background: var(--pink); padding: 12px 22px;
  border: 0; border-radius: 3px;
}
#send:disabled { opacity: .5; cursor: default; }

@media (max-width: 760px) {
  /* The subtitle wraps straight through her name once the
     rail carries four characters. It is decoration; the name
     and the way out are not. */
  #title { display: none; }
  #yuzu { max-width: 82%; height: 92%; }
  #says { position: static; width: auto; margin: 0 18px 10px;
          max-height: 34vh; }
  #says::after { display: none; }
  #stage { justify-items: center; padding-right: 0; }
}
</style>

<div id="room"></div>

<div id="top">
  <div id="who">Yuzu</div>
  <div id="title">gyaru, fully dressed</div>
  <div id="rail"></div>
  <button id="fit" type="button"><span class="hanger">❖</span><span id="fitname">outfit</span></button>
  <div id="home" title="home">⌂</div>
</div>

<div id="stage">
  <div id="glow"></div>
  <!-- A REAL src, not one JavaScript has to supply. She is on screen
       before any fetch resolves, so a dead server costs the wardrobe
       and never costs her. -->
  <img id="yuzu" src="yuzu/zebra.png" alt="Yuzu" title="tap to change">
  <div id="says"></div>
</div>

<form id="ask" autocomplete="off">
  <input id="text" placeholder="Say something to her..." maxlength="2000">
  <button id="send" type="submit">Speak</button>
</form>

<script>
const form = document.getElementById('ask');
const input = document.getElementById('text');
const send = document.getElementById('send');
const says = document.getElementById('says');
const her = document.getElementById('yuzu');
const fit = document.getElementById('fit');
const fitname = document.getElementById('fitname');

document.getElementById('home').onclick = () => {
  location.href = 'home.html';
};

// ---- who else is here ------------------------------------------------
const ME = 'yuzu';
fetch('characters.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(cast => {
    const rail = document.getElementById('rail');
    cast.forEach(c => {
      const here = c.who === ME;
      const el = document.createElement(here ? 'span' : 'a');
      el.textContent = c.name;
      el.title = c.blurb;
      if (here) el.className = 'here';
      else el.href = c.page;
      rail.appendChild(el);
    });
  })
  .catch(() => {});

// ---- the wardrobe ----------------------------------------------------
// The server lists whatever PNGs are in ui/yuzu/. One outfit means no
// button at all: a control with nothing to switch between is furniture
// that lies about what the page can do.
let outfits = [];
let wearing = 0;

function label() {
  const next = outfits[(wearing + 1) % outfits.length];
  fitname.textContent = next.charAt(0).toUpperCase() + next.slice(1);
}

function change(step) {
  if (outfits.length < 2) return;
  wearing = (wearing + step + outfits.length) % outfits.length;
  her.classList.add('changing');
  setTimeout(() => {
    her.src = 'yuzu/' + outfits[wearing] + '.png';
    her.classList.remove('changing');
    label();
  }, 160);
}

fetch('outfits.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(list => {
    if (!Array.isArray(list) || !list.length) return;
    outfits = list;
    // Whatever the markup already shows, if it is in the list, is what
    // she has on -- so the first tap advances from HER rather than
    // snapping her back to the top of the folder.
    const now = her.getAttribute('src').split('/').pop().replace('.png', '');
    const at = outfits.indexOf(now);
    if (at >= 0) wearing = at;
    else her.src = 'yuzu/' + outfits[0] + '.png';
    if (outfits.length > 1) {
      fit.classList.add('on');
      label();
      // Warm the others so a change is instant rather than a blank
      // pause with her missing from her own page.
      outfits.forEach(o => { new Image().src = 'yuzu/' + o + '.png'; });
    }
  })
  .catch(() => {});

fit.onclick = () => change(1);
// Tapping HER changes too. It costs no pixels, it is how you check new
// art, and it is the same call face.html makes about cycling her
// expressions by tapping her face.
her.onclick = () => change(1);

// Stage directions are stripped from the BUBBLE, the same call
// yuzu_voice already makes for the speaker. `[twirls]` is lovely to
// write and it is not what she SAID -- on a small screen it crowds out
// the words that are.
function spoken(text) {
  return text.replace(/\[[^\]]*\]/g, ' ')
             .replace(/\*[^*]*\*/g, ' ')
             .replace(/\s{2,}/g, ' ')
             .trim();
}

function said(text) {
  const words = spoken(text);
  says.textContent = words || text.trim();
  says.classList.add('on');
  says.scrollTop = 0;
}

form.onsubmit = (event) => {
  event.preventDefault();
  const asked = input.value.trim();
  if (!asked) return;
  input.value = '';
  send.disabled = true;
  send.textContent = '...';
  document.body.classList.add('thinking');

  // `who` is a NAME. yuzu_face.CHARACTERS turns it into a persona key
  // and refuses anything that is not in the dict, so nothing typed here
  // can ever name a file.
  fetch('say', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: asked, who: 'yuzu' }),
  })
    .then(r => r.json())
    .then(r => said(r.said || 'She said nothing.'))
    .catch(() => said('No answer from the deck. Is ~/YUZU/face running?'))
    .then(() => {
      send.disabled = false;
      send.textContent = 'Speak';
      document.body.classList.remove('thinking');
      input.focus();
    });
};

if (location.hash === '#say') input.focus();
</script>
