<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kuro</title>
<!--
  KURO — Shiro's younger sister, a grinning little menace on six black
  blade-tipped legs.

  Ghost, Sept 26, bringing her and her sister together: "Id like to make
  both as personas for the new gemma if you think thatd work in a
  hexapod later." The pitch he brought: "She brags about her body and
  teases you with how fast she could scuttle up your wall. She's
  playfully threatening, never creepy-cute." Then: "i wouldnt mind
  giving them Zeros page vibe like the chatbox style. Differwnt
  backgrounds for them tho".

  ZERO'S LAYOUT, HIS WORDS: her picture down the left, a big
  conversation down the right. The conversation code is ZERO'S, copied
  character for character, and a test holds the three pages equal.

  THE DARK PAGE IS HER. Kuro means black and her sister's page is the
  light one. Her picture is a whole scene -- rain, a storm, rubble -- so
  its edges FADE into the page rather than stopping at a frame.

  HER WORDS GLOW PURPLE: "green words=me. Pinks=shiro glow purp=Kuro".
  The purple is the neon one Four already wears (#c04dff), so the deck
  gains no new taste decision, and it glows harder than the others
  because he said glow.

  No network, no fonts, no libraries.
-->
<style>
:root {
  --night:  #121310;          /* the darkest tenth of her storm         */
  --storm:  #2a2b27;
  --panel:  rgba(8,9,7,.9);
  --edge:   #34362f;
  --ink:    #e8ece2;
  --dim:    #8d9587;
  --him:    #39ff5e;          /* neon green, his lines                 */
  --her:    #c04dff;          /* glowing purple, hers -- his call       */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
/* 100dvh, NOT ONLY 100vh: on a phone, 100vh is the height with the
   address bar HIDDEN, so while it shows, the bottom of the page -- the
   Speak row -- sat under the fold. Ghost, on his Z Flip 6: "those
   mobile layout u gave me usually is cut off a bit at the bottom".
   dvh follows the real visible height; a browser that has never heard
   of it keeps the vh line above. */
html, body { height: 100vh; height: 100dvh; overflow: hidden; }
body {
  background:
    radial-gradient(120% 90% at 30% 10%, #3a3b36 0%, var(--storm) 40%,
                    var(--night) 100%);
  color: var(--ink);
  font: 16px/1.5 'Segoe UI', system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
  display: flex; flex-direction: column;
}

/* ---- top ---------------------------------------------------------- */
#top {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 24px 6px;
}
#who { font-size: 21px; letter-spacing: .1em; color: var(--ink);
       font-weight: 700; }
#title { font-size: 12.5px; color: var(--dim); letter-spacing: .04em; }

/* ---- the rail ------------------------------------------------------
   Built from /characters.json, ONE roster in yuzu_face.py, so no page
   holds a list of the cast and none can drift. */
#rail { display: flex; gap: 6px; margin-left: 18px; }
#rail a, #rail span {
  font-size: 12.5px; letter-spacing: .05em; text-decoration: none;
  padding: 4px 11px; border-radius: 2px;
  color: var(--dim); border: 1px solid transparent;
}
#rail a { cursor: pointer; }
#rail a:hover { color: var(--ink); border-color: var(--edge); }
#rail .here {
  color: var(--ink);
  border-color: color-mix(in srgb, var(--her) 55%, transparent);
  background: rgba(192,77,255,.12);
}
#home {
  width: 38px; height: 38px; flex: none; margin-left: auto;
  border-radius: 50%; cursor: pointer; display: grid; place-items: center;
  font-size: 17px; color: var(--ink); background: rgba(0,0,0,.3);
  border: 1px solid #4a4c45;
}

/* ---- her, and the conversation ------------------------------------
   Two columns. minmax(0, 1fr) on the ROW is load-bearing: a grid row
   is `auto` by default and grows to fit a picture. */
#stage {
  flex: 1; min-height: 0;
  display: grid; gap: 18px;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
  padding: 6px 24px calc(18px + env(safe-area-inset-bottom));
}
/* All four edges FADE, two gradients intersected, WIDE -- rendering
   chose them: at 7-10% the bright sky in her corner stopped at a hard
   line, and an oval vignette read as a cameo frame. */
#kuro {
  height: 100%; width: auto; max-width: 44vw;
  object-fit: contain; object-position: center;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 12%, #000 84%, transparent),
                      linear-gradient(to right, transparent, #000 18%, #000 80%, transparent);
  -webkit-mask-composite: source-in;
          mask-image: linear-gradient(to bottom, transparent, #000 12%, #000 84%, transparent),
                      linear-gradient(to right, transparent, #000 18%, #000 80%, transparent);
          mask-composite: intersect;
  transition: filter .6s ease;
}
/* THE "SHE IS THINKING" CUE, Zero's: her storm brightens while a reply
   is coming, with a purple cast, and settles when it lands. */
body.thinking #kuro { animation: prowl 1.4s ease-in-out infinite; }
@keyframes prowl {
  0%, 100% { filter: brightness(1) }
  50%      { filter: brightness(1.3) drop-shadow(0 0 14px rgba(192,77,255,.5)) }
}

#chat {
  min-width: 0; min-height: 0;
  display: flex; flex-direction: column; gap: 12px;
  background: var(--panel);
  border: 1px solid var(--edge);
  border-top: 2px solid var(--her);
  border-radius: 3px; padding: 16px;
  box-shadow: 0 0 28px rgba(192,77,255,.08);
}
#log {
  flex: 1; min-height: 0; overflow-y: auto;
  display: flex; flex-direction: column; gap: 14px;
  padding-right: 4px;
  -webkit-user-select: text; user-select: text;
  scrollbar-width: thin; scrollbar-color: #3a3a3a transparent;
}
#log:empty::before {
  content: 'Say something to her. /wiki cats looks something up first.';
  color: var(--dim); font-size: 15px; margin: auto; text-align: center;
}
.turn { font-size: 17px; line-height: 1.55; white-space: pre-wrap;
        overflow-wrap: anywhere; }
.turn .by { display: block; font-size: 11.5px; letter-spacing: .12em;
            text-transform: uppercase; margin-bottom: 2px; }
/* HIS LINES GREEN, HERS PURPLE -- his colours, words and labels alike.
   Hers glows harder than his: "glow purp", in his words. */
.him { color: var(--him); text-shadow: 0 0 6px rgba(57,255,94,.3); }
.her { color: var(--her); text-shadow: 0 0 8px rgba(192,77,255,.6),
                                       0 0 2px rgba(192,77,255,.4); }
.turn .by { opacity: .75; }
.her.pending { color: var(--dim); text-shadow: none; }
.turn pre.code {
  display: block; max-width: 100%; margin: 8px 0; padding: 10px 12px;
  background: #0b0b0b; color: #f3e9f0; text-shadow: none;
  border: 1px solid var(--edge); border-left: 2px solid var(--her);
  border-radius: 3px;
  font: 14.5px/1.5 ui-monospace, 'DejaVu Sans Mono', 'Liberation Mono', monospace;
  white-space: pre; overflow-x: auto; overflow-wrap: normal;
}
.turn code {
  font: .92em ui-monospace, 'DejaVu Sans Mono', 'Liberation Mono', monospace;
  background: #161616; color: #f3e9f0; text-shadow: none;
  padding: 1px 5px; border-radius: 3px;
}
.her.pending .by { color: var(--her); }
.her.pending .dots { animation: blink 1.2s steps(4) infinite; }
@keyframes blink { 0% { opacity: .3 } 50% { opacity: 1 } 100% { opacity: .3 } }

#ask { display: flex; gap: 10px; align-items: center; }
/* min-width: 0 IS LOAD-BEARING: an <input> will not shrink below its
   intrinsic width without it, which is how Speak got shoved off a phone. */
#text {
  flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink);
  background: #000; padding: 12px 15px; border-radius: 3px;
  border: 1px solid var(--edge);
}
#text::placeholder { color: var(--dim); opacity: .8; }
#text:focus { outline: none; border-color: var(--him); }
/* Speak and the mic are GREEN because what they send is HIS line. */
#send {
  font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
  color: #031006; background: var(--him); padding: 12px 22px;
  border: 0; border-radius: 3px;
}
#send:disabled { opacity: .5; cursor: default; }
#mic {
  flex: none; width: 46px; height: 46px; cursor: pointer;
  display: grid; place-items: center; border-radius: 3px;
  color: var(--him); background: transparent;
  border: 1px solid color-mix(in srgb, var(--him) 55%, transparent);
}
#mic svg { width: 22px; height: 22px; }
#mic.on { color: #031006; background: var(--him);
          animation: live 1.1s ease-in-out infinite; }
@keyframes live { 50% { box-shadow: 0 0 0 7px rgba(57,255,94,.22); } }
#mic.busy { opacity: .45; cursor: default; }
/* What the DECK says, not her: how to fix the mic, what went wrong. */
.note { color: var(--dim); font-size: 14.5px; text-shadow: none; }

@media (max-width: 760px) {
  /* THE WAY OUT MUST NEVER BE THE THING THAT FALLS OFF: the rail takes
     the leftover space and scrolls, the exit keeps its corner.
     `min-width: 0` is the load-bearing half. */
  #rail { flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  #rail::-webkit-scrollbar { display: none; }
  #who { flex: none; }
  #home { flex: none; }
  #title { display: none; }
  /* A phone is the stand-in screen: she goes on top, the conversation
     keeps the room. */
  #stage { grid-template-columns: minmax(0, 1fr);
           grid-template-rows: 30vh minmax(0, 1fr); padding: 6px 14px 14px; }
  #kuro { max-width: 100%; justify-self: center; }
}
</style>

<div id="top">
  <div id="who">Kuro</div>
  <div id="title">The menace</div>
  <div id="rail"></div>
  <div id="home" title="home">⌂</div>
</div>

<div id="stage">
  <!-- A REAL src: she is on screen before any fetch resolves. -->
  <img id="kuro" src="kuro/kuro.jpg" alt="Kuro">
  <div id="chat">
    <div id="log"></div>
    <form id="ask" autocomplete="off">
      <input id="text" placeholder="Say something to her, or /wiki cats" maxlength="2000">
      <button id="mic" type="button" title="talk to her" aria-label="talk to her">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="3" width="6" height="11" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8.5 21h7"/>
        </svg>
      </button>
      <button id="send" type="submit">Speak</button>
    </form>
  </div>
</div>

<script>
const form = document.getElementById('ask');
const input = document.getElementById('text');
const send = document.getElementById('send');
const log = document.getElementById('log');

document.getElementById('home').onclick = () => {
  location.href = 'home.html';
};

// ---- who else is here ------------------------------------------------
const ME = 'kuro';
const SHE = 'Kuro';           // her lines' label -- one place, not two
// HIS LINES CARRY HIS NAME, the one SHE knows him by: `user` in the
// roster is USER_NAME off her persona, so the log and her prompt can
// never disagree about who he is. "you" only if the roster never answers.
let HIM = 'you';
fetch('characters.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(cast => {
    const rail = document.getElementById('rail');
    cast.forEach(c => {
      const here = c.who === ME;
      if (here && c.user) HIM = c.user;
      const el = document.createElement(here ? 'span' : 'a');
      el.textContent = c.name;
      el.title = c.blurb;
      if (here) el.className = 'here';
      else el.href = c.page;
      rail.appendChild(el);
    });
  })
  .catch(() => {});

// Stage directions are stripped from what she SAID, the same call
// yuzu_voice makes for the speaker: they are lovely to write and they
// are not words, and on a small screen they crowd out the ones that are.
//
// ZERO'S COPY WITH ONE CHANGE, on purpose. Zero keeps the words inside
// *asterisks*, because Qwen writes emphasis with them. The sisters are
// role-play characters: "*twitches her legs*" is a GESTURE, and with the
// stars taken off and the words kept it would sit in the log as if she
// said it -- and her voice would read it out. So a single-star span is
// dropped whole; **bold** still keeps its words; and Zero's guards stay,
// so "2 * 3 * 4" is a sum and a line break is a line break.
function spoken(text) {
  return text.replace(/\[[^\]]*\]/g, ' ')
             .replace(/(^|[^\w*])\*\*(?=\S)([^*\n]*?\S)\*\*(?!\w)/g, '$1$2')
             .replace(/(^|[^\w*])\*(?=\S)([^*\n]*?\S)\*(?!\w)/g, '$1 ')
             .replace(/[ \t]{2,}/g, ' ')
             .trim();
}

// ONE TURN IN THE LOG. textContent, never innerHTML: what she writes is
// shown as text, whatever characters are in it.
function entry(cls, by, text) {
  const turn = document.createElement('div');
  turn.className = 'turn ' + cls;
  const label = document.createElement('span');
  label.className = 'by';
  label.textContent = by;
  turn.appendChild(label);
  turn.appendChild(document.createTextNode(text));
  log.appendChild(turn);
  log.scrollTop = log.scrollHeight;
  return turn;
}

// HER CODE, SHOWN AS CODE. A ``` block becomes a code box holding
// EXACTLY what she wrote: it skips spoken() entirely, because that
// strips [brackets] as stage directions -- and `nums = [1, 2, 3]` is
// Python, not a gesture. The words around it are cleaned as before, and
// `inline code` gets a small monospace chip. textContent throughout,
// never innerHTML: what she writes is shown as text, whatever is in it.
//
// AN UNCLOSED FENCE IS STILL CODE. Her replies can hit the ceiling
// mid-block, and the tail of a program shown as prose would lose its
// indentation and its brackets.
function fill(turn, text) {
  text.split('```').forEach((part, i) => {
    if (i % 2) {
      const lines = part.replace(/^[ \t]*\n/, '').split('\n');
      // "```python" -- the language tag is a label, not a line of code.
      if (lines.length > 1 && /^[\w+#.-]*$/.test(lines[0].trim())) lines.shift();
      const code = lines.join('\n').replace(/\s+$/, '');
      if (!code) return;
      const pre = document.createElement('pre');
      pre.className = 'code';
      pre.textContent = code;
      turn.appendChild(pre);
      return;
    }
    const prose = spoken(part);
    if (!prose) return;
    prose.split(/(`[^`\n]+`)/).forEach(bit => {
      if (/^`[^`\n]+`$/.test(bit)) {
        const chip = document.createElement('code');
        chip.textContent = bit.slice(1, -1);
        turn.appendChild(chip);
      } else if (bit) {
        turn.appendChild(document.createTextNode(bit));
      }
    });
  });
}

function said(pending, text) {
  const words = spoken(text);
  pending.remove();
  const turn = entry('her', SHE, '');
  fill(turn, text);
  // Everything cleaned away (a reply that was all stage direction):
  // show it as it came rather than an empty line.
  if (turn.childNodes.length <= 2 && !turn.lastChild.textContent.trim()) {
    turn.appendChild(document.createTextNode(text.trim()));
  }
  log.scrollTop = log.scrollHeight;
  // The server drops ``` blocks before her voice says anything, so the
  // same text as before goes to it -- she never reads code aloud.
  hear(words || text.trim());
}

// ---- SHE SPEAKS OUT OF WHATEVER YOU ARE HOLDING -----------------------
// The board has no speaker on it. Every device that opens this page
// does -- the Steam Deck, a phone, the panel -- so the server renders
// the wav and the BROWSER plays it.
//
// AUTOPLAY IS ALLOWED HERE because he tapped Speak to get this reply,
// and that tap is the user gesture browsers require.
//
// A MISSING VOICE IS SILENT, NEVER AN ERROR ON SCREEN. The reply is the
// product; the audio is a nicety.
//
// SHE SENDS HER OWN NAME. The server builds one voice PER CHARACTER off
// her own `piper_length_scale`, so a copied `who` would hand her
// somebody else's speaking rate. A test drives the name out of the
// real fetch, and holds this block to the other speaking pages'.
let sound = null;
function hear(words) {
  if (!words) return;
  fetch('voice.wav', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: words, who: 'kuro' }),
  })
    .then(r => (r.ok ? r.blob() : null))
    .then(blob => {
      if (!blob) return;
      // The PREVIOUS url is revoked, or a long conversation leaks one
      // object per reply into a browser on a battery-powered handheld.
      if (sound) { try { URL.revokeObjectURL(sound.src); } catch (e) {} }
      sound = new Audio(URL.createObjectURL(blob));
      sound.play().catch(() => {});
    })
    .catch(() => {});
}

form.onsubmit = (event) => {
  event.preventDefault();
  const asked = input.value.trim();
  if (!asked) return;
  input.value = '';
  send.disabled = true;
  send.textContent = '...';
  document.body.classList.add('thinking');
  entry('him', HIM, asked);
  // Where her reply will land, saying so while she works it out.
  const pending = entry('her pending', SHE, 'working it out ');
  const dots = document.createElement('span');
  dots.className = 'dots';
  dots.textContent = '...';
  pending.appendChild(dots);

  // `who` is a NAME. yuzu_face.CHARACTERS turns it into a persona key
  // and refuses anything that is not in the dict, so nothing typed here
  // can ever name a file.
  fetch('say', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: asked, who: 'kuro' }),
  })
    .then(r => r.json())
    .then(r => said(pending, r.said || 'She said nothing.'))
    .catch(() => said(pending, 'No answer from the deck. Is ~/YUZU/face running?'))
    .then(() => {
      send.disabled = false;
      send.textContent = 'Speak';
      document.body.classList.remove('thinking');
      input.focus();
    });
};

// ---- TALK TO HER, ONLY WHEN HE WANTS TO ------------------------------
// Ghost: "a button for the touch screen starts listening when i tap it,
// ends recording when i tap it again and bam". Nothing listens until he
// taps, and it stops when he taps again -- or after a minute, so a
// recording he forgot about cannot run forever.
//
// THE MICROPHONE IS WHATEVER HE IS HOLDING. This page records on his
// own device, sends the clip to the board (/listen), and what comes
// back is sent exactly as if he had typed it. The board has no mic.
//
// A BROWSER ONLY HANDS A PAGE THE MIC WHEN IT TRUSTS THE PAGE -- https,
// or the device's own localhost. His address is plain http on his WiFi,
// so on his phone or laptop the mic is refused until he tells the
// browser to trust it, once. The note says exactly how, with this
// page's own address in it, rather than a mic that silently does
// nothing.
const mic = document.getElementById('mic');
let recorder = null, clip = [], cap = null;

function note(text) { entry('note', 'deck', text); }

mic.onclick = async () => {
  if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
  // Busy working out the last clip, or she is still answering.
  if (mic.classList.contains('busy') || send.disabled) return;
  if (!(window.isSecureContext && navigator.mediaDevices
        && navigator.mediaDevices.getUserMedia && window.MediaRecorder)) {
    note('This browser only lets a page use the microphone once it trusts '
         + 'the page. One time, in Chrome on this device: open '
         + 'chrome://flags/#unsafely-treat-insecure-origin-as-secure , '
         + 'type ' + location.origin + ' in the box, set it to Enabled, '
         + 'and tap Relaunch (on a Steam Deck in Gaming Mode, restart the '
         + 'Deck instead -- a relaunched Chrome there goes invisible). '
         + 'Chrome then shows a warning bar about the flag; that is '
         + 'expected. Then tap the mic again.');
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    note('The microphone was blocked. Allow it for this page -- the icon '
         + 'by the address -- then tap the mic again.');
    return;
  }
  // Her voice must not end up in his recording.
  if (sound) { try { sound.pause(); } catch (e) {} }
  clip = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (e) => { if (e.data && e.data.size) clip.push(e.data); };
  recorder.onstop = () => {
    clearTimeout(cap);
    stream.getTracks().forEach(t => t.stop());      // the mic goes OFF
    mic.classList.remove('on');
    mic.classList.add('busy');
    mic.title = 'working out what you said';
    const audio = new Blob(clip, { type: recorder.mimeType || 'audio/webm' });
    fetch('listen', { method: 'POST',
                      headers: { 'Content-Type': audio.type },
                      body: audio })
      .then(r => r.json())
      .then(r => {
        if (r.ok && r.heard) {
          input.value = r.heard;
          form.requestSubmit();
        } else {
          note(r.said || "I didn't catch that.");
        }
      })
      .catch(() => note('No answer from the deck. Is ~/YUZU/face running?'))
      .then(() => { mic.classList.remove('busy'); mic.title = 'talk to her'; });
  };
  recorder.start();
  mic.classList.add('on');
  mic.title = 'listening -- tap again to stop';
  cap = setTimeout(() => {
    if (recorder && recorder.state === 'recording') recorder.stop();
  }, 60000);
};

if (location.hash === '#say') input.focus();
</script>
