<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saya</title>
<!--
  Her face. Eyes and a mouth on a colour you can change -- Ghost's spec,
  Sept 9: "doesnt have to be her face i just like her eyeshape... anime
  eyes and mouth on a screen with a background color i can change."

  Everything is SVG and CSS. No image files, no fonts, no network, no
  build step. Open it in a browser and it works -- which also means it
  works in the VNC session TODAY, at the panel's real 1024x600, weeks
  before the screen arrives.

  Tweaking it: every colour and size is a --variable at the top of the
  stylesheet. Change one number, reload, see it.
-->
<style>
:root {
  /* ------- the two you will actually touch ------- */
  --bg:        #1b1420;      /* background. tap a swatch to change */
  --iris:      #e8a33d;      /* amber, off her reference */

  /* ------- the rest, tune once ------- */
  --lash:      #14090f;      /* upper lash line, the heaviest mark */
  --sclera:    #fdf6ef;
  --brow:      #b4344f;
  --mouth:     #d8506a;
  --glow:      #e8a33d;
  --eye-w:     190px;
  --eye-h:     150px;
  --eye-gap:   150px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { position: relative; }
body {
  background: var(--bg);
  display: grid;
  place-items: center;
  font: 15px system-ui, sans-serif;
  transition: background .6s ease;
  -webkit-user-select: none; user-select: none;
  cursor: default;
}

/* The face sits in a fixed-ratio box so it scales to any panel and
   still lands right on the 1024x600 it is actually for. */
#face {
  display: grid;
  grid-template-columns: auto auto;
  gap: var(--eye-gap);
  place-items: center;
  margin-bottom: 40px;
}
.eye { width: var(--eye-w); height: var(--eye-h); overflow: visible; }

/* ---- blink -------------------------------------------------------
   The single cheapest thing that makes a face look alive. Runs on
   idle only; every other expression owns the eyes.               */
@keyframes blink {
  0%, 92%, 100% { transform: scaleY(1); }
  95%           { transform: scaleY(.06); }
}
.lid-group { transform-origin: center 55%; }
body.idle .lid-group,
body.happy .lid-group { animation: blink 5.2s infinite; }
body.idle.slow .lid-group { animation-duration: 8s; }

/* ---- breathing ---------------------------------------------------
   Two pixels of drift. Invisible until it stops, and then the screen
   looks dead -- which is the point.                              */
@keyframes breathe {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}
#face { animation: breathe 4.5s ease-in-out infinite; }

/* ---- expressions -------------------------------------------------
   Every variant is drawn in the SVG and switched on here, so nothing
   is computed and nothing can get out of sync.                   */
.v { display: none; }
body.idle     .v-idle,
body.happy    .v-happy,
body.annoyed  .v-annoyed,
body.talking  .v-talking,
body.asleep   .v-asleep   { display: block; }

body.asleep { --bg: #0d0910; }
body.asleep #face { opacity: .55; animation-duration: 9s; }

/* thinking is a MODIFIER, not an expression: she can think while
   annoyed. It is the most valuable state on the screen -- see
   DECK_UI.md -- so it reads at a glance without a word of text. */
@keyframes pulse { 0%,100% { opacity:.25 } 50% { opacity:.9 } }
#think { opacity: 0; transition: opacity .3s; }
body.thinking #think { opacity: 1; }
body.thinking #think circle { animation: pulse 1.1s infinite; }
body.thinking #think circle:nth-child(2) { animation-delay: .18s; }
body.thinking #think circle:nth-child(3) { animation-delay: .36s; }

/* ---- mouth ------------------------------------------------------- */
#mouth { position: absolute; bottom: 26%; }
@keyframes talk {
  0%,100% { transform: scaleY(.55) }
  50%     { transform: scaleY(1.35) }
}
body.talking #mouth path { transform-origin: center; animation: talk .28s infinite; }

/* ---- chrome ------------------------------------------------------ */
#home {
  position: fixed; right: 22px; bottom: 18px;
  width: 54px; height: 54px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.28);
  background: rgba(255,255,255,.07);
  display: grid; place-items: center;
  color: rgba(255,255,255,.75); font-size: 22px;
}
#swatches { position: fixed; left: 18px; bottom: 18px; display: flex; gap: 10px; }
#swatches i {
  width: 30px; height: 30px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.3); cursor: pointer;
}
#states {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px; opacity: .5;
}
#states b {
  font-weight: 500; font-size: 13px; padding: 5px 11px; border-radius: 20px;
  color: #fff; background: rgba(255,255,255,.1); cursor: pointer;
}
#states b.on { background: var(--iris); color: #201007; }
</style>

<div id="face">
  <!-- LEFT EYE -->
  <svg class="eye" viewBox="0 0 190 150">
    <g class="lid-group">
      <!-- idle: sharp almond, outer corner lifted -->
      <g class="v v-idle">
        <path d="M12 82 Q60 26 150 44 Q176 50 180 66 Q150 118 74 116 Q28 112 12 82Z" fill="var(--sclera)"/>
        <circle cx="104" cy="79" r="33" fill="var(--iris)"/>
        <circle cx="104" cy="79" r="15" fill="#1a0d06"/>
        <circle cx="94"  cy="68" r="9"  fill="#fff" opacity=".92"/>
        <path d="M10 80 Q58 20 152 40 Q180 47 182 64 Q168 44 140 38 Q60 22 10 80Z" fill="var(--lash)"/>
        <path d="M12 82 Q60 26 150 44 Q176 50 180 66" fill="none" stroke="var(--lash)" stroke-width="13" stroke-linecap="round"/>
      </g>
      <!-- happy: closed upward arc -->
      <g class="v v-happy">
        <path d="M18 96 Q95 34 176 92" fill="none" stroke="var(--lash)" stroke-width="15" stroke-linecap="round"/>
      </g>
      <!-- annoyed: narrowed, brow driven down -->
      <g class="v v-annoyed">
        <path d="M20 88 Q70 56 158 68 Q176 72 178 82 Q150 112 76 110 Q34 106 20 88Z" fill="var(--sclera)"/>
        <circle cx="106" cy="86" r="29" fill="var(--iris)"/>
        <circle cx="106" cy="86" r="13" fill="#1a0d06"/>
        <circle cx="97"  cy="78" r="7"  fill="#fff" opacity=".9"/>
        <path d="M18 86 Q68 50 160 64 Q178 68 180 80 Q166 62 146 58 Q68 46 18 86Z" fill="var(--lash)"/>
      </g>
      <!-- talking: wide, bright -->
      <g class="v v-talking">
        <path d="M10 80 Q58 20 152 40 Q180 48 184 66 Q152 122 72 118 Q26 112 10 80Z" fill="var(--sclera)"/>
        <circle cx="104" cy="77" r="35" fill="var(--iris)"/>
        <circle cx="104" cy="77" r="15" fill="#1a0d06"/>
        <circle cx="93"  cy="65" r="10" fill="#fff" opacity=".95"/>
        <path d="M8 78 Q56 16 154 36 Q182 44 186 62 Q170 40 142 34 Q58 18 8 78Z" fill="var(--lash)"/>
      </g>
      <!-- asleep: lash line only -->
      <g class="v v-asleep">
        <path d="M22 84 Q95 112 172 82" fill="none" stroke="var(--lash)" stroke-width="13" stroke-linecap="round"/>
      </g>
    </g>
    <!-- brows live OUTSIDE the blink group so they do not squash -->
    <path class="v v-annoyed" d="M14 34 Q80 14 168 40" fill="none"
          stroke="var(--brow)" stroke-width="14" stroke-linecap="round"/>
    <path class="v v-idle" d="M22 22 Q90 6 170 24" fill="none"
          stroke="var(--brow)" stroke-width="11" stroke-linecap="round" opacity=".85"/>
  </svg>

  <!-- RIGHT EYE: the same drawing, mirrored. One shape to maintain. -->
  <svg class="eye" id="right" viewBox="0 0 190 150" style="transform:scaleX(-1)"></svg>
</div>

<svg id="mouth" width="150" height="80" viewBox="0 0 150 80">
  <g class="v v-idle">
    <path d="M52 24 Q75 40 98 24" fill="none" stroke="var(--mouth)" stroke-width="9" stroke-linecap="round"/>
  </g>
  <g class="v v-happy">
    <path d="M40 18 Q75 62 110 18 Q75 34 40 18Z" fill="var(--mouth)"/>
  </g>
  <g class="v v-annoyed">
    <path d="M46 34 Q75 18 104 34" fill="none" stroke="var(--mouth)" stroke-width="9" stroke-linecap="round"/>
  </g>
  <g class="v v-talking">
    <path d="M50 12 Q75 12 100 12 Q100 56 75 56 Q50 56 50 12Z" fill="var(--mouth)"/>
  </g>
  <g class="v v-asleep">
    <path d="M62 30 Q75 38 88 30" fill="none" stroke="var(--mouth)" stroke-width="7"
          stroke-linecap="round" opacity=".6"/>
  </g>
</svg>

<svg id="think" width="120" height="30" viewBox="0 0 120 30">
  <circle cx="20" cy="15" r="8" fill="var(--iris)"/>
  <circle cx="60" cy="15" r="8" fill="var(--iris)"/>
  <circle cx="100" cy="15" r="8" fill="var(--iris)"/>
</svg>

<div id="home">⌂</div>
<div id="swatches"></div>
<div id="states"></div>

<script>
// Mirror the left eye into the right one without duplicating the art.
document.getElementById('right').innerHTML =
  document.querySelectorAll('.eye')[0].innerHTML;

const STATES = ['idle', 'happy', 'annoyed', 'talking', 'asleep'];
const COLOURS = ['#1b1420', '#0e1a1c', '#1d1526', '#221108', '#0b1020', '#000000'];

function setState(name) {
  document.body.className = name;
  document.querySelectorAll('#states b').forEach(b =>
    b.classList.toggle('on', b.textContent === name));
  try { localStorage.setItem('saya-state', name); } catch (e) {}
}
function setColour(hex) {
  document.documentElement.style.setProperty('--bg', hex);
  try { localStorage.setItem('saya-bg', hex); } catch (e) {}
}

// The demo controls. These come OUT once the brain drives the face --
// they exist so he can see all five expressions without a server.
STATES.forEach(s => {
  const b = document.createElement('b');
  b.textContent = s;
  b.onclick = () => setState(s);
  document.getElementById('states').append(b);
});
COLOURS.forEach(c => {
  const i = document.createElement('i');
  i.style.background = c;
  i.onclick = () => setColour(c);
  document.getElementById('swatches').append(i);
});

let saved;
try { saved = localStorage.getItem('saya-bg'); } catch (e) {}
if (saved) setColour(saved);
setState('idle');

// A tap on her face cycles expressions, so the whole thing is usable
// on a touchscreen with no keyboard at all.
document.getElementById('face').onclick = () =>
  setState(STATES[(STATES.indexOf(document.body.className.split(' ')[0]) + 1) % STATES.length]);
</script>
