<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saya</title>
<!--
  Her face.

  THE ART IS NOT IN THIS FILE. Ghost drew/cropped real anime
  expressions into transparent PNGs, because the hand-drawn SVG version
  read as MS Paint and he was right. So this page draws nothing: it
  asks `yuzu_face.py` what art exists and renders it.

      ui/sprites/<name>.png      drop a file in, it is an expression

  Adding a face is adding a file. No list here to update, nothing to
  keep in sync, no code to touch -- which is exactly what he asked for:
  "set it up as a sprite system so i can just swap out the image files".

  HER LINE WORK IS PAINTED BY CSS, NOT BY A SECOND IMAGE. Each sprite
  is used as a MASK and the ink is one variable -- neon green on black.
  Black art on a black screen is nothing, so the mask is what makes this
  look possible at all.

  THE COLOUR SWAP IS GONE. Ghost, Sept 11: "id like it removed. only use
  the cool green on black crt for ui." He is right, and it was never a
  feature -- it was a settings panel parked on her face. The button it
  used to own now opens the V-PET, which is a thing you can actually do.

  THE MOUTH PAINT IS GONE, same message: "Revert back to strictly
  lineart on a colored background. No need for tongue/teeth paint."
  Her eyes and the inside of her mouth are HOLES in the art, so the
  background still shows straight through them -- that was never the
  paint layer's doing.

  No network, no fonts, no libraries. Works with the WiFi off, which is
  the entire point of this deck.
-->
<style>
:root {
  --bg:   #000000;      /* the deck has ONE look and this is it */
  --ink:  #39ff5e;      /* HER LINE WORK. the mask is filled with this */
  --face: min(76vw, 74vh);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  font: 15px system-ui, -apple-system, sans-serif;
  transition: background .45s ease;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* ---- the layout --------------------------------------------------
   A column, not four fixed things fighting over the bottom edge. The
   first version overlapped the speech bubble with a row of expression
   chips and cut her chin off -- caught by screenshotting it, like
   everything else visual in this project.

   The chips are GONE. Ghost: "remove the visual clues i can change her
   expression i want that automatic." The brain drives her face now, so
   a row of buttons offering to do it by hand advertised the wrong
   thing. Tapping her face still cycles, because that costs no pixels
   and is how you check new art.                                     */
/* stretch, explicitly: the old layout set place-items:center and it
   survived the switch to a column, squeezing the ask bar to the width
   of its own text. */
body { display: flex; flex-direction: column;
       align-items: stretch; justify-content: flex-end; }

#stage {
  flex: 1; min-height: 0; position: relative;
  display: flex; align-items: center; justify-content: center;
}
#face {
  position: relative;
  height: 100%; width: min(78vw, 100%);
  animation: breathe 4.6s ease-in-out infinite;
  cursor: pointer;
}
/* HER INK. The sprite is the MASK and this box is the colour, which is
   why one variable recolours every expression, including the blink
   frame, with no second copy of the art anywhere. */
#art {
  position: absolute; inset: 0;
  background-color: var(--ink);
  -webkit-mask-image: var(--sprite); mask-image: var(--sprite);
  -webkit-mask-size: contain;   mask-size: contain;
  -webkit-mask-position: center; mask-position: center;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  pointer-events: none;
  /* the gaze offset. Small on purpose -- see the note by the code. */
  transform: translate(var(--gx, 0px), var(--gy, 0px));
  transition: transform .5s ease-out, background-color .45s ease;
}
/* Blink is a FRAME, not an animation. You cannot squash a flat sprite
   without smearing the line work, so squashing was never the answer --
   swapping to a drawn closed-eye frame is, and Ghost drew one. */
@keyframes breathe {
  0%, 100% { transform: translateY(0)     scale(1)     }
  50%      { transform: translateY(-10px) scale(1.012) }
}
/* thinking gets a slower, heavier drift -- she is busy, not idle. */
body.thinking #face { animation-duration: 2.6s; }

/* ---- THE CRT LOOK, which is now the only look ---------------------
   Scanlines, corner brackets, a dark translucent dialogue box. All of
   it is CSS and none of it fetches anything.

   It used to be a mode you could tap out of. It is not any more: the
   deck is green on black everywhere, and the ONE page allowed to break
   that rule is the V-Pet, deliberately, because it is its own little
   world.                                                            */
#hud { position: fixed; inset: 10px; pointer-events: none; }
#hud i {
  position: absolute; width: 26px; height: 26px;
  border: 2px solid var(--ink); opacity: .55;
}
#hud i:nth-child(1) { top: 0; left: 0;  border-right: 0; border-bottom: 0; }
#hud i:nth-child(2) { top: 0; right: 0; border-left: 0;  border-bottom: 0; }
#hud i:nth-child(3) { bottom: 0; left: 0;  border-right: 0; border-top: 0; }
#hud i:nth-child(4) { bottom: 0; right: 0; border-left: 0;  border-top: 0; }
#scan {
  position: fixed; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(
      to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.18) 2px 3px);
  mix-blend-mode: multiply;
}

/* ---- the telemetry chip -------------------------------------------
   Power mode, temperature, and how fast she is actually generating.
   It sits under her chin because that is where he looks while waiting.

   THE REASON IT EARNS THE PIXELS is the power mode. The Orin ships
   THROTTLED and forgetting `sudo nvpmodel -m 0` makes everything slow
   with no visible cause -- so this is the first place that is visible
   without running anything. Fields that cannot be read are ABSENT, so
   on his phone the chip simply does not appear.                     */
#badge {
  align-self: center; margin: 0 auto 8px; display: none;
  font-size: 12.5px; letter-spacing: .04em; font-weight: 600;
  padding: 5px 12px; border-radius: 999px;
  background: rgba(0,0,0,.16); color: rgba(0,0,0,.62);
  border: 1px solid rgba(0,0,0,.16);
}
#badge.on { display: flex; gap: 10px; align-items: center; }
/* A DRAWN battery, not an emoji: an emoji is a full-colour bitmap that
   ignores --ink, so it would sit on the black theme as a glossy blob
   while everything around it went neon. */
.cell {
  display: inline-block; vertical-align: -2px;
  width: 22px; height: 11px; margin-right: 5px;
  border: 1.5px solid currentColor; border-radius: 3px;
  position: relative;
}
.cell::after {
  content: ''; position: absolute; right: -4px; top: 3px;
  width: 2.5px; height: 5px; background: currentColor;
  border-radius: 0 1px 1px 0;
}
.cell b { display: block; height: 100%; background: currentColor; }
#batt.low { color: #ff4d6a; }
/* One separator style across the whole chip -- the flex gap alone made
   the board stats and the battery read as two different rows. */
#board:not(:empty) + #batt:not(:empty)::before {
  content: '·'; margin-right: 10px; opacity: .55;
}
#badge.warn { background: #d81b3a; color: #fff; border-color: #d81b3a; }
#badge {
  background: rgba(0,0,0,.55); color: var(--ink);
  border-color: color-mix(in srgb, var(--ink) 45%, transparent);
}

/* ---- what she said ------------------------------------------------ */
#says {
  margin: 0 auto 10px; max-width: min(92vw, 46em);
  background: rgba(255,255,255,.9); color: #14090f;
  border: 2px solid rgba(0,0,0,.28); border-radius: 16px;
  padding: 12px 16px; font-size: 16px; line-height: 1.45;
  max-height: 30vh; overflow-y: auto;
  display: none;
}
#says.on { display: block; }
#says {
  background: rgba(13,13,17,.85); color: var(--ink);
  border-color: color-mix(in srgb, var(--ink) 55%, transparent);
  border-radius: 4px;
}

/* ---- saying something back ---------------------------------------- */
#ask {
  display: flex; gap: 8px; align-items: center;
  padding: 0 14px calc(12px + env(safe-area-inset-bottom));
}
#ask input {
  flex: 1; min-width: 0; font: inherit; font-size: 16px;
  padding: 11px 15px; border-radius: 999px;
  border: 2px solid rgba(0,0,0,.28); background: rgba(255,255,255,.92);
  color: #14090f;
}
#ask button {
  font: inherit; font-weight: 700; font-size: 16px;
  padding: 11px 20px; border-radius: 999px; cursor: pointer;
  border: 2px solid rgba(0,0,0,.28); background: #111; color: #fff;
  white-space: nowrap;
}
#ask button:disabled { opacity: .45; }
#ask input {
  background: rgba(13,13,17,.85); color: var(--ink);
  border-color: color-mix(in srgb, var(--ink) 55%, transparent);
  border-radius: 4px;
}
#ask input::placeholder {
  color: color-mix(in srgb, var(--ink) 50%, transparent);
}
#ask button {
  background: var(--ink); color: #06080a; border-color: var(--ink);
  border-radius: 4px;
}
/* Two buttons, both round, both the same weight: one goes home, one
   opens the V-Pet. The colour dot that used to sit here is GONE --
   "id like it removed" -- and this is what its pixels bought. */
#pet, #home {
  width: 42px; height: 42px; flex: none; border-radius: 50%;
  cursor: pointer; display: grid; place-items: center;
  background: rgba(13,13,17,.85); color: var(--ink); font-size: 19px;
  border: 2px solid color-mix(in srgb, var(--ink) 55%, transparent);
}
#pet svg {
  width: 24px; height: 24px; fill: none; stroke: var(--ink);
  stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
}

#empty {
  padding: 28px; max-width: 30em; line-height: 1.6; margin: auto;
  color: rgba(0,0,0,.7); text-align: center;
}
#empty { color: var(--ink); }
</style>

<div id="stage">
  <div id="face" hidden><div id="art"></div></div>
  <div id="hud"><i></i><i></i><i></i><i></i></div>
</div>
<div id="empty" hidden></div>
<div id="scan"></div>

<div id="badge"><span id="board"></span><span id="batt"></span></div>
<div id="says"></div>

<form id="ask" autocomplete="off">
  <input id="text" placeholder="Say something to her..." maxlength="2000">
  <button id="send" type="submit">Send</button>
  <div id="pet" title="her pet"><svg viewBox="0 0 24 24"><path d="M12 20c-4 0-6.5-2.2-6.5-5.5C5.5 11 8 8.5 12 8.5s6.5 2.5 6.5 6c0 3.3-2.5 5.5-6.5 5.5z"/><path d="M8 8.2 6.6 4.5 9.6 6M16 8.2 17.4 4.5 14.4 6"/><path d="M10 14h.01M14 14h.01"/></svg></div>
  <div id="home" title="home">⌂</div>
</form>

<script>
// ONE LOOK, and no control for it. Ghost, Sept 11: "id like it
// removed. only use the cool green on black crt for ui." The colour
// swap was a settings panel parked on her face, and the button it owned
// now opens the V-Pet -- a thing you can actually do.
//
// The ink is still a CSS variable and her art is still a MASK, because
// that is what makes green line work possible at all: her PNGs are
// black on transparency, and black on a black screen is nothing.

let expressions = [];
let roles = null;
let current = 0;

function paintSprite(file) {
  document.getElementById('art').style.setProperty(
    '--sprite', 'url("' + file + '")');
}

function show(i) {
  if (!expressions.length) return;
  current = (i + expressions.length) % expressions.length;
  const e = expressions[current];
  paintSprite(e.file);
  document.body.classList.remove(...[...document.body.classList]
    .filter(c => c !== 'thinking'));
  document.body.classList.add(e.name);
  try { localStorage.setItem('saya-face', e.name); } catch (err) {}
}

document.getElementById('pet').onclick = () => {
  location.href = 'vpet.html';
};

fetch('sprites.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(m => {
    expressions = m.expressions || [];
    roles = m.roles || {};
    if (!expressions.length) {
      const box = document.getElementById('empty');
      box.hidden = false;
      box.textContent = 'No art in ui/sprites/ yet. Drop transparent '
        + 'PNGs in there — the filename becomes the expression name.';
      return;
    }
    document.getElementById('face').hidden = false;
    // Default to the IDLE role, not to expressions[0] -- that is
    // alphabetical, so she would boot with her eyes shut on `blink`.
    let saved = null;
    try { saved = localStorage.getItem('saya-face'); } catch (err) {}
    const wanted = saved || (m.roles && m.roles.idle);
    const at = expressions.findIndex(e => e.name === wanted);
    show(at < 0 ? 0 : at);
    watch();
  })
  .catch(() => {
    const box = document.getElementById('empty');
    box.hidden = false;
    box.textContent = 'Could not read sprites.json. Start her with '
      + '~/YUZU/face rather than opening this file directly.';
  });

// A tap on her face cycles expressions, so the whole thing works on a
// touchscreen with no keyboard anywhere near it.
document.getElementById('face').onclick = () => {
  driven = null;            // he chose; let him keep it
  show(current + 1);
};

// ⌂ goes to the home screen. It was decoration until now, which is
// worse than not being there: a button that does nothing on a
// touchscreen reads as a broken deck.
document.getElementById('home').onclick = () => { location.href = 'home.html'; };

// ---- she looks at where you touch -----------------------------------
// Ghost wanted her pupils to track his touch. THEY CANNOT: her eyes are
// holes in flat line art, there is no pupil layer to move, and cutting
// one out of a drawing at runtime is the iris-ring smear all over
// again. So the WHOLE face leans a few pixels toward the touch instead
// -- same intent, no surgery on his art, and it works on every sprite
// he will ever draw including ones with the eyes shut.
//
// Small and slow on purpose. Anything bigger reads as the picture
// sliding around; at five pixels it reads as attention. It decays back
// to centre after two seconds of being left alone, so her resting state
// is always looking straight out.
const GAZE_MAX = 5;          // pixels. more than this looks like drift
const GAZE_HOLD = 2000;      // ms before she settles back
let gazeTimer = null;

function gaze(x, y) {
  const face = document.getElementById('face');
  const box = face.getBoundingClientRect();
  if (!box.width) return;
  const dx = x - (box.left + box.width / 2);
  const dy = y - (box.top + box.height / 2);
  const len = Math.hypot(dx, dy) || 1;
  const art = document.getElementById('art');
  art.style.setProperty('--gx', (dx / len * GAZE_MAX).toFixed(1) + 'px');
  art.style.setProperty('--gy', (dy / len * GAZE_MAX).toFixed(1) + 'px');
  clearTimeout(gazeTimer);
  gazeTimer = setTimeout(() => {
    art.style.setProperty('--gx', '0px');
    art.style.setProperty('--gy', '0px');
  }, GAZE_HOLD);
}
addEventListener('pointerdown', (e) => gaze(e.clientX, e.clientY));
addEventListener('pointermove', (e) => {
  // Touch only reports while a finger is down, which is what we want.
  // A mouse would otherwise drag her eyes around constantly.
  if (e.pointerType !== 'touch' && !e.buttons) return;
  gaze(e.clientX, e.clientY);
});

// ---- she reacts -----------------------------------------------------
// The face was a picture until now: it did not know she existed. The
// brain writes what it is doing to a file, the server serves it, and
// this asks. `thinking` is the whole point -- every frustration in this
// project's log is "is it working or is it stuck", and a face that
// visibly thinks answers that with no status text at all.
//
// The BRAIN wins over a tap: an expression she was put into by hand is
// overridden the moment she actually starts thinking, because what she
// is really doing beats what someone poked.
let driven = null;      // the expression the brain asked for, if any
let lastSaid = '';

function faceFor(role) {
  if (!roles) return null;
  const want = roles[role];
  if (!want) return null;
  const at = expressions.findIndex(e => e.name === want);
  return at < 0 ? null : at;
}

function watch() {
  fetch('state', { cache: 'no-store' })
    .then(r => r.json())
    .then(s => {
      // HER MOOD WINS OVER HER STATUS while she is talking, and only
      // then. Ghost: "saya never uses the cute blushing faces even
      // when shes blushing" -- she never could, because `talking`
      // resolves to one sprite and nothing else was ever asked for.
      // The mood comes from HER OWN stage directions, so a wrong face
      // needs her to have written the wrong thing.
      const want = faceFor(s.state === 'talking' && s.mood ? s.mood : s.state);
      if (want !== null && want !== driven) {
        driven = want;
        show(want);
      }
      // `thinking` also drives the CSS, so the breathe speeds up even
      // when there is no separate thinking sprite to switch to.
      document.body.classList.toggle('thinking', s.state === 'thinking');
      if (s.said && s.said !== lastSaid) {
        lastSaid = s.said;
        speech(s.said);
      }
    })
    .catch(() => {})
    .then(() => setTimeout(watch, 900));
}

// ---- the battery ----------------------------------------------------
// THIS DECK CANNOT SEE A PERCENTAGE TODAY and does not pretend to. The
// power path is a PD bank -> a barrel jack, and a barrel jack carries
// volts and nothing else: no data line, no fuel gauge, no state of
// charge. So there are exactly two honest displays and one absence:
//
//   a real battery node   ->  the kernel's percentage. Appears by
//                             itself the day a UPS HAT is added.
//   the Jetson's own rail ->  WATTS being drawn, measured, right now,
//                             plus hours FROM FULL at that draw.
//   neither               ->  nothing at all.
//
// "~4.1h/full" is worded that way on purpose. It is not hours
// REMAINING -- remaining needs a state of charge nothing here can read,
// and inventing one is the confident lie this project keeps refusing.
//
// Identical in home.html, deliberately: two pages, no build step, and a
// test asserts the two copies agree.
function charge(box, s) {
  if (typeof s.percent === 'number') {
    box.innerHTML = '<i class="cell"><b></b></i>';
    box.querySelector('b').style.width = s.percent + '%';
    box.append(s.percent + '%' + (s.charging ? ' chg' : ''));
    box.classList.toggle('low', s.percent < 20 && !s.charging);
    return;
  }
  box.classList.remove('low');
  box.textContent = s.watts
    ? s.watts + 'W' + (s.hours ? '  ·  ~' + s.hours + 'h/full' : '')
    : '';
}

// ---- what the board is doing ----------------------------------------
// Slower than the face poll on purpose: a temperature that updates
// every second is a number nobody can read.
function telemetry() {
  fetch('stats', { cache: 'no-store' })
    .then(r => r.json())
    .then(s => {
      const badge = document.getElementById('badge');
      const board = document.getElementById('board');
      const bits = [];
      if (s.power) bits.push(s.power);
      if (s.temp) bits.push(s.temp + '°C');
      if (s.rate) bits.push(s.rate + ' t/s');
      // The throttle warning REPLACES the row rather than joining it.
      // It is the only thing on this chip he has to act on.
      board.textContent = s.throttled || bits.join('  ·  ');
      badge.classList.toggle('warn', !!s.throttled);
      charge(document.getElementById('batt'), s);
      badge.classList.toggle('on',
        !!(board.textContent || document.getElementById('batt').textContent));
    })
    .catch(() => {})
    .then(() => setTimeout(telemetry, 5000));
}
telemetry();

function speech(text) {
  const box = document.getElementById('says');
  // Bracketed stage directions are for reading, but they are not what
  // she SAID -- and on a small screen they crowd out the words that
  // are. Same call yuzu_voice already makes for the speaker.
  box.textContent = text.replace(/\[[^\]]*\]/g, '')
                        .replace(/\*[^*]+\*/g, '')
                        .replace(/\s{2,}/g, ' ').trim() || text;
  box.classList.add('on');
  box.scrollTop = 0;
}

// ---- talking to her -------------------------------------------------
const form = document.getElementById('ask');
const input = document.getElementById('text');
const send = document.getElementById('send');

form.onsubmit = (event) => {
  event.preventDefault();
  const said = input.value.trim();
  if (!said) return;
  input.value = '';
  send.disabled = true;
  send.textContent = '...';
  // Show HER state immediately rather than waiting for the poll: on
  // that board a reply takes tens of seconds, and a screen that does
  // nothing for the first second reads as a tap that missed.
  const at = faceFor('thinking');
  if (at !== null) { driven = at; show(at); }
  document.body.classList.add('thinking');

  fetch('say', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: said }),
  })
    .then(r => r.json())
    .then(r => { speech(r.said || 'She said nothing.'); })
    .catch(() => speech('No answer from the deck. Is ~/YUZU/face running?'))
    .then(() => {
      send.disabled = false;
      send.textContent = 'Send';
      document.body.classList.remove('thinking');
      input.focus();
    });
};

// ---- blink --------------------------------------------------------
// The cheapest thing that makes a face look alive, and the difference
// between "her face is on screen" and "she is sitting there".
//
// It only ever swaps the IMAGE, briefly, and only while she is idle --
// an expression she was put into on purpose must not be interrupted by
// a stray frame. Irregular on purpose: a metronome blink reads as a
// broken GIF.
function blinkLoop() {
  const gap = 2600 + Math.random() * 3800;
  setTimeout(() => {
    const blink = expressions.find(e => e.name === 'blink');
    const now = expressions[current];
    if (blink && now && now.name === 'idle' && !document.hidden) {
      paintSprite(blink.file);
      setTimeout(() => {
        // Re-read rather than closing over it: she may have been
        // tapped to another face during the 120ms the eyes were shut.
        if (expressions[current] && expressions[current].name === 'idle') {
          paintSprite(now.file);
        }
      }, 120);
    }
    blinkLoop();
  }, gap);
}
blinkLoop();
</script>
