<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Four</title>
<!--
  FOUR — the deck's own voice, and the front door.

  Ghost, Sept 15, picking her art out of three candidates: "Ascii/matrix
  face one. I uploaded it to the git for ya. Can u make it like..
  animated somehow if possible?" and "Name her Four."

  SHE IS GREEN ON BLACK, AND SHE IS THE ONLY CHARACTER WHO SHOULD BE.
  Cait, Yuzu and Mimi each get a palette sampled off their own art,
  because each of them is a different thing that happens to run on this
  board. Four is not a guest on the deck -- she IS the deck, on the
  cyberdeck body, and her picture is already the deck's exact colours.
  Giving her a palette of her own would be inventing a difference that
  is not there.

  HER ART IS NOT CUT OUT, AND THAT IS THE FINDING.
  Measured on the source: the border is pure black (median brightness
  1.0 of 255) and 55.8% of the whole picture is near-black -- because
  her shadow side IS the backdrop colour, with no outline between them.
  ART.txt already says a costume that matches the backdrop cannot be
  floodfilled, and `ghost_crowd` only survived because her own outline
  closed the bridge. There is no bridge to close here: a flood from the
  edge would walk straight into her face and take half of it.

  It does not need one. She is BRIGHT ON BLACK, and `mix-blend-mode:
  screen` composites exactly that for free -- black contributes nothing,
  so the backdrop falls away by arithmetic rather than by a flood's
  guess, and every soft edge survives perfectly. No cutout, no alpha, no
  recipe, no PIL. The right tool was already in the browser.

  It also means the rain behind her shows THROUGH her dark side, which
  is the whole animation: she is made of running characters, so the
  characters run.

  THE RAIN IS DIGITS AND ASCII, NEVER KATAKANA. The Matrix glyph set is
  the obvious choice and it is a trap on this board: a missing CJK font
  renders every glyph as a tofu box, and whether Ubuntu on his Orin has
  one is not something this project can check from here. Her own art is
  made of digits and latin characters anyway, so the safe set is also
  the faithful one.

  No network, no fonts, no libraries.
-->
<style>
/* ---- THE PALETTE LIVES ON `body`, NOT ON `:root`, AND THAT IS THE
   WHOLE MECHANISM. Ghost, Sept 16: "Id like for Fours screen to be
   tappable on touch. When tapped it changes the color of everything
   about her to a neon red. Another tap makes her and the raining code
   Neon Purple. Tap again to go back to the green. Only do this for
   Four."

   A custom property's `var()` is substituted when that property is
   COMPUTED on an element. So `--edge` declared on `:root` would bake
   in `:root`'s green ink and inherit it down already-resolved, and
   every derived colour would stay green while `--ink` turned red.
   Declared on `body` -- the element the theme class lands on -- every
   one of them re-resolves against the winning `--ink`. One block per
   colour, nothing hardcoded anywhere else, and a fourth colour is one
   more block.

   `--tint` is how her ART is recoloured, and it is a whole filter
   rather than a colour because her picture is a JPEG rather than line
   work on transparency. `none` on green, so her art is untouched in
   the colour she ships in. See `#four`. */
body {
  --bg:   #000000;
  --ink:  #39ff5e;            /* the deck's neon green, unchanged      */
  --dim:  #1f7a37;
  --box:  rgba(6, 14, 8, .88);
  --edge: color-mix(in srgb, var(--ink) 40%, transparent);
  --head: #c8ffd4;            /* the bright leading character          */
  --tail: rgba(57, 255, 94, .55);
  --key:  #04120a;            /* text ON the Speak button              */
  --tint: none;
}
body.red {
  --ink:  #ff2b39;
  --dim:  #8a1b24;
  --box:  rgba(16, 5, 6, .88);
  --head: #ffd0d4;
  --tail: rgba(255, 43, 57, .55);
  --key:  #120405;
  --tint: url(#four-red) brightness(1.28);
}
body.purple {
  --ink:  #c04dff;
  --dim:  #5f2a85;
  --box:  rgba(12, 6, 16, .88);
  --head: #eecfff;
  --tail: rgba(192, 77, 255, .55);
  --key:  #0d0414;
  --tint: url(#four-purple) brightness(1.22);
}
/* HIS OWN HOT PINK, not a new one. `#ff2d95` and the cyan below are two
   of the four he picked for Saya's face by name -- "Hot pink, Cyan,
   Neon green, And a Lavender or purple color. Only those colors." --
   so the deck gains a colour without gaining a taste decision. */
body.pink {
  --ink:  #ff2d95;
  --dim:  #8a1850;
  --box:  rgba(16, 4, 10, .88);
  --head: #ffd0e8;
  --tail: rgba(255, 45, 149, .55);
  --key:  #120409;
  --tint: url(#four-pink) brightness(1.26);
}
/* ---- SHE THINKS IN THE OTHER COLOUR ---------------------------------
   Ghost, Sept 16: *"i dislike the words typing up as she says it thing
   as im a speed reader. Can we just give her a thinking pose somehow
   that only shows when shes thinking?"* and then, plainly: *"Just turn
   the raining code neon purple when thinking. In general. (Except for
   purple main should have green code) ... Only during thinking."*

   He is right and it is the better trade. The word-by-word reveal
   existed to answer "is it working or is it stuck" -- a real question
   this deck keeps answering -- but it answers it by making a fast
   reader wait for text he could already have read. The rain changing
   colour says the same thing at a glance, across the whole screen,
   and costs him nothing.

   HER ART IS NOT TOUCHED. A first pass tinted patches of her numbers
   and it was wrong twice over: her picture is a JPEG, so the accent
   had to be a second masked copy of her, and `screen` ADDS -- purple
   over her green came out cyan rather than purple. Rendering said so
   in one look. The rain is drawn by us, character by character, so
   its colour is simply ours to set.

   These sit LAST on purpose. `body.thinking` and `body.red` have the
   same specificity, so source order is what settles it; `body.purple
   .thinking` carries two classes and wins over both wherever it has
   to. Only `--head` and `--tail` move, and nothing but the rain reads
   them, so this cannot reach anything else on the page. */
body.thinking {
  --head: #eecfff;                     /* the purple palette, exactly */
  --tail: rgba(192, 77, 255, .55);
}
body.purple.thinking {
  --head: #c8ffd4;                     /* and green when she IS purple */
  --tail: rgba(57, 255, 94, .55);
}
/* PINK THINKS IN A BLUER, BRIGHTER PURPLE THAN THE DECK'S OWN, and
   rendering is the whole reason. His word was "bright purple", and the
   theme purple `#c04dff` sits 49 degrees of hue from her `#ff2d95` --
   both magenta-ish -- so against her art it came out the WEAKEST of
   the four signals, reading as dim pink-on-pink rather than as another
   colour. Pushed bluer and up in alpha until it separates, checked by
   rendering three candidates side by side at 1024x600 and looking.
   The other three keep the deck purple, where there is no clash. */
body.pink.thinking {
  --head: #e8dcff;
  --tail: rgba(157, 92, 255, .68);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100vh; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  display: flex; flex-direction: column;
}

/* ---- the rain -------------------------------------------------------
   Behind everything, including her. It is the floor she stands on and
   the thing she is made of, so it is not decoration that can be
   dropped -- but it IS the one expensive thing on this page, so it
   throttles itself and stops dead when the page is hidden. */
#rain {
  position: fixed; inset: 0; z-index: 0;
  /* QUIET. The first pass ran at .5 idle and .9 thinking and the
     picture it produced was a wall of code with a girl somewhere in
     it -- she is the subject and the rain is the room. */
  opacity: .32; transition: opacity .5s ease;
}
body.thinking #rain { opacity: .6; }

/* ---- the scanline sweep --------------------------------------------
   One bright band travelling down the panel. It is what makes a STILL
   picture read as a live signal rather than a wallpaper, and it costs
   one element and one keyframe. */
#sweep {
  position: fixed; left: 0; right: 0; height: 26%; z-index: 3;
  pointer-events: none;
  background: linear-gradient(to bottom,
              transparent 0%,
              color-mix(in srgb, var(--ink) 7%, transparent) 45%,
              color-mix(in srgb, var(--ink) 12%, transparent) 50%,
              transparent 100%);
  animation: sweep 7s linear infinite;
}
@keyframes sweep {
  0%   { transform: translateY(-30%) }
  100% { transform: translateY(420%) }
}
/* And the fixed scanlines under it. 3px, faint -- at 1024x600 anything
   tighter turns into a moiré against her own character grid, which was
   visible the moment it was rendered. */
#lines {
  position: fixed; inset: 0; z-index: 4; pointer-events: none;
  background: repeating-linear-gradient(to bottom,
              rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
}

/* ---- top ----------------------------------------------------------- */
/* IT NEEDS A BACKING, and rendering is what said so. The rail is four
   other characters' names and the way out of her screen, and both were
   illegible against rain falling straight through them. A tap he
   cannot read is the same dead end as a tap that does nothing. */
#top {
  position: relative; z-index: 5;
  display: flex; align-items: center; gap: 12px;
  padding: 16px 24px 10px;
  background: linear-gradient(to bottom, rgba(0,0,0,.94) 55%, transparent);
}
#who { font-size: 20px; font-weight: 700; letter-spacing: .22em; }
#title { font-size: 12px; color: var(--dim); letter-spacing: .1em; }
#rail { display: flex; gap: 6px; margin-left: 18px; }
#rail a, #rail span {
  font-size: 12.5px; letter-spacing: .05em; text-decoration: none;
  padding: 4px 11px; border-radius: 2px;
  color: var(--dim); border: 1px solid transparent;
}
#rail a { cursor: pointer; }
#rail a:hover { color: var(--ink); border-color: var(--edge); }
#rail .here {
  color: var(--ink); border-color: var(--edge); background: rgba(0,0,0,.45);
}
#home {
  margin-left: auto; width: 38px; height: 38px; flex: none;
  border-radius: 3px; cursor: pointer; display: grid; place-items: center;
  font-size: 17px; color: var(--ink); background: rgba(0,0,0,.4);
  border: 1px solid var(--edge);
}

/* ---- her ------------------------------------------------------------ */
#stage {
  flex: 1; min-height: 0; position: relative; overflow: hidden;
  display: grid; align-items: start; justify-items: end;
  padding-right: 3%;
  /* minmax(0, 1fr), for the reason Cait's page records: a grid row is
     `auto` by default, so it grows to fit the image and a percentage
     height has nothing bounded to resolve against. */
  grid-template-rows: minmax(0, 1fr);
  /* NO z-index HERE, AND THAT IS LOAD-BEARING. It had `z-index: 1`,
     which -- with `position: relative` -- creates a STACKING CONTEXT,
     and `mix-blend-mode` only ever blends against the backdrop inside
     its own context. So she was compositing against nothing and her
     black JPEG painted as an opaque black rectangle over the rain:
     measured by rendering it, where the right third of the screen went
     dead flat while every column on the left kept falling. `position:
     relative` alone does not create one, so dropping the z-index is
     the whole fix. */
}
#four {
  height: 122%; max-width: 50%;
  object-fit: contain; object-position: top center;
  /* THE WHOLE CUTOUT, IN ONE DECLARATION. Her backdrop is black and
     black contributes nothing under `screen`, so it disappears exactly
     -- soft edges and all -- and the rain runs through her. */
  mix-blend-mode: screen;
  /* HER ART IS A JPEG, so she cannot take a colour variable -- she is
     a picture of green characters, not line work on transparency the
     way Saya's sprites are. What she CAN take is a rotation, and
     because the whole picture is one hue that is enough: the hue of
     `#39ff5e` is 131deg -- but `hue-rotate` is NOT a hue rotation. It
     is a fixed luminance-preserving matrix, and RENDERING IS WHAT SAID
     SO: the arithmetically correct 225deg came out AMBER, and sweeping
     twenty values of a sepia-based chain never landed on the red at
     all, because saturating a one-hue picture clips its channels to
     the primaries.

     So she is tinted rather than turned. `#four-red` and `#four-purple`
     are inline SVG colour matrices, at the foot of this file: they take
     her LUMINANCE and multiply it into one exact colour, which is
     deterministic and needs no sweeping. Inline, so there is still
     nothing fetched.

     A filter creates a stacking context, and a stacking context on her
     PARENT is what silently switched this blend off once already. On
     the element ITSELF it does not: the filter is applied first and the
     result is then blended into the backdrop, which is the defined
     order. Verified by rendering, not by reading the spec -- the rain
     still runs through her dark side in all three colours. */
  filter: var(--tint);
  animation: flicker 6s steps(1, end) infinite;
  position: relative;
  cursor: pointer;
}
/* A SIGNAL, NOT A BREATH. Cait and Yuzu breathe because they are drawn
   people standing in a room. Four is a picture made of running
   characters; the honest idle for her is an unsteady feed. Irregular
   steps on purpose -- an even pulse reads as a broken GIF, which is
   the same finding as the blink timing on Saya's face. */
@keyframes flicker {
  0%, 38%, 41%, 72%, 74%, 100% { opacity: 1 }
  39%   { opacity: .82 }
  40%   { opacity: 1 }
  73%   { opacity: .88 }
}
body.thinking #four { animation-duration: 1.6s; }


/* ---- what she says --------------------------------------------------
   She stands right, her words go left -- the fix Cait's page paid for
   by rendering it: a box at left with width 46% ends exactly in the
   middle of the screen, which is exactly where a centred figure is. */
#says {
  position: absolute; left: 3.5%; bottom: 6%; width: 44%; max-height: 74%;
  overflow-y: auto; display: none; z-index: 2;
  background: var(--box);
  border: 1px solid var(--edge); border-left: 3px solid var(--ink);
  border-radius: 2px; padding: 15px 17px;
  font-size: 15.5px; line-height: 1.6;
}
#says.on { display: block; }
#says::before {
  content: '> '; color: var(--dim);
}

/* ---- asking ---------------------------------------------------------- */
#ask {
  position: relative; z-index: 5;
  background: linear-gradient(to top, #000 62%, transparent);
  display: flex; gap: 10px; align-items: center;
  padding: 10px 24px calc(18px + env(safe-area-inset-bottom));
}
#text {
  flex: 1; font: inherit; font-size: 15px; color: var(--ink);
  background: rgba(0,0,0,.55); padding: 12px 15px; border-radius: 2px;
  border: 1px solid var(--edge);
}
#text::placeholder { color: var(--dim); }
#text:focus { outline: none; border-color: var(--ink); }
#send {
  font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
  color: var(--key); background: var(--ink); padding: 12px 22px;
  border: 0; border-radius: 2px;
}
#send:disabled { opacity: .5; cursor: default; }

@media (max-width: 760px) {
  /* THE WAY OUT MUST NEVER BE THE THING THAT FALLS OFF. Measured at
     412px: the home button sat 15 to 169px past the right edge on ALL
     FOUR character pages, worse the longer the rail got, because the
     rail is content-width and pushes it. On the panel it is fine and
     it has been fine since Cait shipped, which is exactly why nobody
     saw it -- 1024x600 is the only view that gets designed.
     The rail takes the leftover space and scrolls; the exit keeps its
     corner. `min-width: 0` is the load-bearing half: a flex item will
     not shrink below its content without it. */
  #rail { flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  #rail::-webkit-scrollbar { display: none; }
  #who { flex: none; }
  #home { flex: none; }
  /* Inherited from the other character pages and NOT a supported
     layout -- 1024x600 is the panel and the only view that gets
     designed. The subtitle is what wraps through her name first. */
  #title { display: none; }
  #four { max-width: 84%; height: 108%; }
  #says { position: static; width: auto; margin: 0 16px 10px;
          max-height: 34vh; }
  #stage { justify-items: center; padding-right: 0; }
}
</style>


<!-- HER TINTS. Two colour matrices, inline, nothing fetched.
     Each row is her LUMINANCE (0.2126 R, 0.7152 G, 0.0722 B) scaled
     by one channel of the target colour, so a bright green pixel
     becomes an equally bright pixel of that colour and a black one
     stays black -- which is what keeps `mix-blend-mode: screen`
     working and the rain running through her dark side.

     THE TWO HEX VALUES HERE ARE THE SAME AS `--ink` ABOVE, and a
     test pins that they still agree: a page that turns red around a
     girl who turned some other red is the two-copies fault this deck
     already guards in the battery renderer and the way out.

     `color-interpolation-filters="sRGB"` is load-bearing. The SVG
     default is linearRGB, which washes the result out badly enough
     to read as the wrong colour. -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <filter id="four-red" color-interpolation-filters="sRGB">
    <!-- neon red   -- #ff2b39, matching --ink on body.red -->
    <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0
              0.0359 0.1206 0.0122 0 0
              0.0475 0.1599 0.0161 0 0
              0 0 0 1 0"/>
  </filter>
  <filter id="four-pink" color-interpolation-filters="sRGB">
    <!-- hot pink -- #ff2d95, matching --ink on body.pink -->
    <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0
              0.0375 0.1262 0.0127 0 0
              0.1242 0.4179 0.0422 0 0
              0 0 0 1 0"/>
  </filter>
  <filter id="four-purple" color-interpolation-filters="sRGB">
    <!-- neon purple -- #c04dff, matching --ink on body.purple -->
    <feColorMatrix type="matrix" values="0.1601 0.5385 0.0544 0 0
              0.0642 0.2160 0.0218 0 0
              0.2126 0.7152 0.0722 0 0
              0 0 0 1 0"/>
  </filter>
</svg>

<canvas id="rain"></canvas>
<div id="sweep"></div>
<div id="lines"></div>

<div id="top">
  <div id="who">FOUR</div>
  <div id="title">resident</div>
  <div id="rail"></div>
  <div id="home" title="home">⌂</div>
</div>

<div id="stage">
  <img id="four" src="four/four.jpg" alt="Four">
  <div id="says"></div>
</div>

<form id="ask" autocomplete="off">
  <input id="text" placeholder="Say something, or /wiki black holes" maxlength="2000">
  <button id="send" type="submit">Speak</button>
</form>

<script>
// ---- the rain ---------------------------------------------------------
// Vanilla canvas, no library, because this deck has to work with the
// WiFi off and a CDN is the one thing it can never have.
//
// DIGITS AND ASCII ONLY. Katakana is the obvious glyph set and it is a
// trap: a board with no CJK font draws every one of them as a tofu box,
// and her own art is made of digits anyway.
const GLYPHS = '01234567890123456789ABCDEF<>[]{}/\\|=+*-_:;.';
const canvas = document.getElementById('rain');
const ctx = canvas.getContext('2d');
const CELL = 18;   // fewer, wider columns; 14 was a wall
let cols = [], wide = 0, tall = 0;

function fit() {
  wide = canvas.width = window.innerWidth;
  tall = canvas.height = window.innerHeight;
  const n = Math.ceil(wide / CELL);
  cols = [];
  for (let i = 0; i < n; i++) {
    // Start scattered ABOVE the screen so it is already raining when
    // the page opens rather than starting as one tidy line.
    cols.push(-Math.random() * (tall / CELL));
  }
}

// THROTTLED ON PURPOSE, and this is not a micro-optimisation. This is a
// handheld running off a battery bank with an LLM sharing its memory;
// a canvas loop at the panel's full refresh rate is heat and watts
// spent on wallpaper. Fourteen frames a second is what falling text
// wants anyway -- faster stops reading as discrete characters.
// THE RAIN ASKS THE STYLESHEET WHAT COLOUR IT IS, and that is what
// keeps one palette rather than two. The head and tail were hardcoded
// here as '#c8ffd4' and 'rgba(57,255,94,.55)', so a theme could turn
// every pixel of the page red and leave the falling code green --
// exactly the kind of second list this deck keeps deleting. Read once
// per theme and cached, because getComputedStyle every frame on a
// battery-powered handheld is the opposite of why this loop throttles.
let head = '#c8ffd4', tail = 'rgba(57, 255, 94, 0.55)';
function repaint() {
  const css = getComputedStyle(document.body);
  head = css.getPropertyValue('--head').trim() || head;
  tail = css.getPropertyValue('--tail').trim() || tail;
}
repaint();

let last = 0;
function draw(now) {
  requestAnimationFrame(draw);
  const step = document.body.classList.contains('thinking') ? 45 : 72;
  if (now - last < step) return;
  last = now;

  // A translucent wipe rather than a clear: what is left behind is the
  // trail, and its alpha is the trail's length.
  ctx.fillStyle = 'rgba(0, 0, 0, 0.13)';   // shorter trails
  ctx.fillRect(0, 0, wide, tall);
  ctx.font = CELL + 'px ui-monospace, monospace';

  for (let i = 0; i < cols.length; i++) {
    const y = cols[i] * CELL;
    const ch = GLYPHS[(Math.random() * GLYPHS.length) | 0];
    // The leading character is bright and the tail is dim. One bright
    // head per column is what makes it read as falling rather than as
    // static noise.
    ctx.fillStyle = head;
    ctx.fillText(ch, i * CELL, y);
    ctx.fillStyle = tail;
    ctx.fillText(GLYPHS[(Math.random() * GLYPHS.length) | 0], i * CELL, y - CELL);

    cols[i]++;
    if (y > tall && Math.random() > 0.975) cols[i] = 0;
  }
}

fit();
window.addEventListener('resize', fit);
requestAnimationFrame(draw);

// A page nobody is looking at must not burn the battery. rAF already
// stops in a hidden tab in Chromium, but the deck opens her with
// --app and the guard costs one line.
document.addEventListener('visibilitychange', () => { last = 0; });

// HER PICTURE IS ABSENT RATHER THAN BROKEN. A missing file would
// otherwise draw the browser's torn-page icon in the middle of her own
// screen; hidden, the rain is still running and the page still reads as
// intentional. Same rule as a character with no icon still getting a
// tile.
document.getElementById('four').onerror = function () {
  this.style.visibility = 'hidden';
};

// ---- the page ---------------------------------------------------------
const form = document.getElementById('ask');
const input = document.getElementById('text');
const send = document.getElementById('send');
const says = document.getElementById('says');

document.getElementById('home').onclick = () => { location.href = 'home.html'; };

// ---- TAP HER SCREEN TO CHANGE HER COLOUR ------------------------------
// Ghost, Sept 16: green -> neon red -> neon purple -> green. HER ONLY:
// the other three characters have palettes sampled off their own art
// and the deck's own green-on-black is locked everywhere else.
//
// IT IS THE STAGE, NOT THE WHOLE PAGE. The top bar and the ask bar carry
// the way out, the rail and the text box, and a tap that lands on any of
// those must do what it says rather than also recolouring the screen.
// #says is excluded for the same reason: her reply can be long enough to
// scroll, and a scroll that also changes colour reads as a bug.
//
// NOTHING IS REMEMBERED, deliberately. A reload is green, which is what
// the deck is, and it is the state anyone else who picks her up meets --
// she is the front door. One line of localStorage makes it sticky if he
// would rather; this is the version with nothing to explain.
const SKINS = ['', 'red', 'purple', 'pink'];
let skin = 0;
document.getElementById('stage').addEventListener('click', (event) => {
  if (event.target.closest('#says')) return;
  // EVERY skin comes off, from SKINS itself. It read
  // `remove('red', 'purple')` -- a SECOND hardcoded list of the
  // colours, one layer under the one this page already deletes -- so
  // the day pink landed, the fourth tap added nothing (green is the
  // empty class) and pink stayed stuck on the body forever. Measured
  // by Ghost in one tap: "doesnt loop back to the green etc".
  document.body.classList.remove(...SKINS.filter(Boolean));
  skin = (skin + 1) % SKINS.length;
  if (SKINS[skin]) document.body.classList.add(SKINS[skin]);
  // The canvas keeps its own copy of the two colours, so it has to be
  // told. Without this the page turns red around rain that stays green.
  repaint();
});

// The roster comes from the server, so this page holds no list of the
// cast and cannot drift from it. An unreachable rail is ABSENT -- her
// page still works, you just cannot hop from it.
const ME = 'four';
fetch('characters.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(cast => {
    // THE FRONT DOOR SHOWS NOBODY ELSE. She is the character a stranger
    // meets with no context, so a row of four other AIs across the top
    // of her screen is the demo answering a question nobody asked.
    //
    // GATED ON `front`, NEVER ON HER NAME. Testing `ME === 'four'` here
    // would be the hardcoded cast in its fourth costume -- after Mimi
    // being invisible from the front page, `#saya { border-color }`
    // glowing on a tile that had moved into a drawer, and an app icon
    // called "Saya's Face" pointing at a page Four had taken over. Move
    // FRONT one word and this follows: she gets her rail back the day
    // she is an ordinary character again, and the failure mode of
    // getting it wrong is a deck that looks like it is working.
    //
    // THE WAY OUT IS NOT IN HERE. The home button is its own element
    // beside the rail, so an empty rail costs the hop and never costs
    // the exit -- the one rule this deck will not trade.
    const mine = cast.find(c => c.who === ME);
    if (mine && mine.front) return;
    const rail = document.getElementById('rail');
    cast.forEach(c => {
      const here = c.who === ME;
      const el = document.createElement(here ? 'span' : 'a');
      el.textContent = c.name;
      el.title = c.blurb;
      if (here) el.className = 'here';
      else el.href = c.page;
      rail.appendChild(el);
    });
  })
  .catch(() => {});

// Stage directions are stripped from the BUBBLE, the same call
// yuzu_voice makes for the speaker: it is lovely to write and it is not
// what she SAID, and on a small screen it crowds out the words that are.
function spoken(text) {
  return text.replace(/\[[^\]]*\]/g, ' ')
             .replace(/\*[^*]*\*/g, ' ')
             .replace(/\s{2,}/g, ' ')
             .trim();
}

function said(text) {
  const words = spoken(text);
  says.textContent = words || text.trim();
  says.classList.add('on');
  says.scrollTop = 0;
  hear(words || text.trim());
}

// ---- SHE SPEAKS OUT OF WHATEVER YOU ARE HOLDING -----------------------
// The board has no speaker on it. Every device that opens this page
// does -- the Steam Deck, a phone, the panel -- so the server renders
// the wav and the BROWSER plays it.
//
// AUTOPLAY IS ALLOWED HERE because he tapped Speak to get this reply,
// and that tap is the user gesture browsers require. Audio that arrives
// unasked, on a page he never touched, is the thing they block -- and
// it is also the thing nobody wants on a handheld.
//
// A MISSING VOICE IS SILENT, NEVER AN ERROR ON SCREEN. The reply is the
// product; the audio is a nicety, the same promise the face, Piper and
// the wiki all make. If Kokoro is not installed the page behaves
// exactly as it did before this existed.
let sound = null;
function hear(words) {
  if (!words) return;
  fetch('voice.wav', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: words, who: 'four' }),
  })
    .then(r => (r.ok ? r.blob() : null))
    .then(blob => {
      if (!blob) return;
      // The PREVIOUS url is revoked, or a long conversation leaks one
      // object per reply into a browser on a battery-powered handheld.
      if (sound) { try { URL.revokeObjectURL(sound.src); } catch (e) {} }
      sound = new Audio(URL.createObjectURL(blob));
      sound.play().catch(() => {});
    })
    .catch(() => {});
}

// ONE PLACE TURNS THE THINKING STATE ON AND OFF, because two things
// now hang off it: the class the stylesheet reads, and the canvas's own
// cached copy of the two rain colours. The canvas has to be TOLD -- the
// palette is read once per change rather than per frame, for the reason
// the loop throttles at all. Forgetting the repaint is the same fault
// as the page turning red around rain that stayed green.
function thinking(on) {
  document.body.classList.toggle('thinking', on);
  repaint();
}

form.onsubmit = (event) => {
  event.preventDefault();
  const asked = input.value.trim();
  if (!asked) return;
  input.value = '';
  send.disabled = true;
  send.textContent = '...';
  thinking(true);

  // `who` is a NAME. yuzu_face.CHARACTERS turns it into a persona key
  // and refuses anything that is not in the dict, so nothing typed here
  // can ever name a file.
  //
  // SHE ARRIVES WHOLE. The word-by-word reveal is gone, at his request:
  // *"i dislike the words typing up as she says it thing as im a speed
  // reader."* It existed to answer "is it working or is it stuck" on a
  // page that sat dead for ten to thirty seconds -- and the thinking
  // GLOW answers that better, because it says the same thing without
  // making a fast reader wait for text he could already have read.
  //
  // `/stream` is NOT removed from the server. Saya's face still uses
  // it, it is the same `answer()` with a callback, and deleting a
  // working route because one page stopped calling it is a change
  // nobody asked for.
  plain(asked)
    .catch(() => said('No answer from the deck. Is ~/YUZU/face running?'))
    .then(() => {
      send.disabled = false;
      send.textContent = 'Speak';
      thinking(false);
      input.focus();
    });
};

function plain(asked) {
  return fetch('say', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: asked, who: 'four' }),
  })
    .then(r => r.json())
    .then(r => said(r.said || 'She said nothing.'));
}

if (location.hash === '#say') input.focus();
</script>
