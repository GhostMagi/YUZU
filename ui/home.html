<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deck</title>
<!--
  The home screen. Ghost, Sept 10: "id like home button to take me to a
  desktop with my apps and a saya button visible."

  This is the thing the ⌂ on her face goes to, and the thing the deck
  boots into. Big touch targets, no text entry anywhere, no scrolling
  on 1024x600.

  A WEB PAGE CANNOT START mGBA. That is the one real problem here, and
  the answer is a POST to `/launch/<name>` which yuzu_face.py runs
  against a HARD-CODED ALLOWLIST -- three names, no arguments from the
  page, nothing that can become "run this string". Anything else is a
  local web server that executes what it is told, on a board sitting on
  his WiFi.

  ONE LOOK. Ghost, Sept 11: "id like it removed. only use the cool
  green on black crt for ui." The swatches are gone from both screens
  and there is no control for it anywhere.

  The icons are line drawings in this file, not emoji. Ghost wanted
  "clean single-color line icons... rather than smartphone", and the
  libraries that ship them (Lucide, Feather) are a download -- so these
  are drawn here, four paths, no dependency, any colour.

  No network, no fonts, no libraries.
-->
<style>
:root {
  --bg:   #000000;
  --ink:  #39ff5e;
  --tile: rgba(13,13,17,.85);
  --edge: color-mix(in srgb, var(--ink) 45%, transparent);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
/* 100dvh after 100vh: on a phone, 100vh is the height with the address
   bar HIDDEN, so while it shows the bottom row sat under the fold (his
   Z Flip 6, Sept 26). dvh is what is really visible; an older browser
   keeps the vh line. */
html, body { height: 100vh; height: 100dvh; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px system-ui, -apple-system, sans-serif;
  transition: background .45s ease;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  display: flex; flex-direction: column;
}

/* ---- top bar: the clock, and nothing else -------------------------
   The board has no RTC and starts at 1969 until NTP lands, so a wrong
   clock here is a KNOWN state rather than a bug -- see CLAUDE.md. It
   is still worth showing: it is the fastest way to notice the board
   has not reached the network yet.                                  */
#top {
  display: flex; align-items: baseline; gap: 12px;
  padding: 14px 20px 4px;
}
#clock { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
#date  { font-size: 14px; opacity: .65; }
#warn  { margin-left: auto; font-size: 13px; font-weight: 600;
         opacity: .8; display: none; }
/* The battery sits with the clock, because that is where a handheld
   wears it. A DRAWN cell rather than an emoji: an emoji is a
   full-colour bitmap that would ignore --ink and sit on the black
   theme as a glossy blob. */
#batt { margin-left: auto; font-size: 14px; font-weight: 600; opacity: .85; }
#warn:not([style*="none"]) ~ #batt { margin-left: 12px; }
.cell {
  display: inline-block; vertical-align: -2px;
  width: 24px; height: 12px; margin-right: 5px;
  border: 1.5px solid currentColor; border-radius: 3px;
  position: relative;
}
.cell::after {
  content: ''; position: absolute; right: -4px; top: 3px;
  width: 2.5px; height: 6px; background: currentColor;
  border-radius: 0 1px 1px 0;
}
.cell b { display: block; height: 100%; background: currentColor; }
#batt.low { color: #ff4d6a; }

/* ---- the tiles ---------------------------------------------------- */
/* 2x2, filling the screen. The first layout used auto-fit and left
   Game Boy orphaned on a row of its own with half the panel empty --
   caught by screenshotting it at the panel's real 1024x600 rather than
   by reading the CSS. Same rule as the art: look at it. */
#grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  grid-auto-rows: 1fr;
  gap: 12px;
  padding: 8px 20px 14px;
  min-height: 0;
}
/* ---- two views, one grid -----------------------------------------
   Ghost, Sept 11: "lets hide the gameboy tab for now its not as
   important. or put it and the wikipedia tabs under a tab called
   ☆Misc☆ we can pile up our fancy future apps in that tab."

   So the front page is the four things he actually opens and ☆Misc☆ is
   the drawer. It is the SAME PAGE with the tiles swapped rather than a
   second file: a new page would need its own way out, and every screen
   on this deck having an exit is the rule two power cycles paid for.
   Here the ⌂ tile IS that exit and it goes back to the front page.

   It also puts the grid back to four equal thumb targets, which is
   what it was before the fifth tile forced a spanning row. */
[data-view] { display: none !important; }
#grid.main [data-view="main"], #grid.stuff [data-view="stuff"],
#grid.misc [data-view="misc"], #grid.ai [data-view="ai"] {
  display: flex !important;
}
.stars { letter-spacing: .06em; }

/* EACH VIEW GETS THE COLUMNS THAT FIT IT, and that is the whole rule
   here. The front page held three in one row while Saya and Cait were
   the only characters; Yuzu made it FOUR, and four across three
   columns orphans one onto a row of its own -- the `auto-fit` bug
   that a screenshot caught on the very first home screen, and that
   the fifth tile brought back once already. Four goes in a 2x2.

   The drawer stays three across: it is where he means to "pile up our
   fancy future apps", so it grows. A single shared grid would force
   one of them to look wrong.

   AND THE DRAWER CENTRES ITS LAST ROW, because it is the one view
   whose count moves both ways. Six filled two rows of three exactly;
   then the V-Pet went (Sept 23, "put the vpet aside ... As in 'delete
   it' from the cyberdeck") and five left a hole in the bottom right.
   Rendered three ways at 1024x600 and looked at: five across made tall
   skinny pillars, and a grid of three left the hole. A wrapping row
   of thirds, centred, keeps every tile the size it was and turns the
   short row into a deliberate one -- and the next tile he adds lands
   in it without anybody touching this rule. */
#grid.main { grid-template-columns: repeat(2, 1fr); }
#grid.stuff { grid-template-columns: repeat(2, 1fr); }
#grid.misc { display: flex; flex-wrap: wrap; justify-content: center;
             align-content: stretch; }
#grid.misc > .tile { flex: 0 0 calc((100% - 2 * 12px) / 3); }
/* THE A.I. VIEW SETS ITS OWN LAYOUT FROM JAVASCRIPT -- its columns AND
   its icon size, together, off one number -- because it is the only
   view whose tile count is not known when this file is written: it is
   built from the roster. `columnsFor()` is the rule, and it is there
   so a fifth character cannot orphan one onto a row of its own, which
   is the bug a screenshot caught on the very first home screen and
   that a fifth tile brought back once already.

   IT DELIBERATELY HAS NO STATIC RULE OF ITS OWN HERE, and that is the
   Sept 20 finding. It used to carry `repeat(2, 1fr)`, which was true
   of the cast that happened to exist -- and the two-tile ICON rule
   below names views instead of counting columns, so when the cast was
   cut to two the drawer got two big tiles wearing the small icons. A
   static rule about a view whose size comes off the roster is right
   only until the roster changes. `#grid`'s own two columns above are
   the fallback for a roster that never answers. */

/* THE WAY OUT LIVES IN THE BAR, not in the grid. Ghost means to "pile
   up our fancy future apps" in the drawer, so a Back TILE would spend
   an app slot forever and move every time the drawer grew. In the bar
   it is in the same place whatever is on screen -- which is what an
   exit has to be on a deck with no keyboard. */
#back {
  display: none; font: inherit; font-weight: 700; font-size: 15px;
  color: var(--ink); background: var(--tile); cursor: pointer;
  border: 2px solid var(--edge); border-radius: 4px; padding: 8px 16px;
}
#grid:not(.main) ~ #bar #back { display: block; }

/* THE d20, THE CALCULATOR AND THE BROWSER ARE GONE. Ghost, Sept 30:
   "Browser button, Calculator button, and D20 can go away now cuz we
   makin a bot now. Those will be fairly useless on a metal spider."
   `git show 1f42a38:ui/home.html` has all three. */
/* ON A PHONE THE DRAWER IS TWO ACROSS, and the grid SCROLLS rather than
   run under the bar. It was one tile per row, and the sixth tile ("Save
   my stuff", Sept 29) rendered at 412px sat BEHIND Back / Desktop /
   Update, where no tap could reach it -- found by rendering it, not by
   any assertion. Two across keeps every tile a thumb target; the scroll
   is the guarantee for the next tile, and for a shorter phone. */
@media (max-width: 560px) { #grid { grid-template-columns: 1fr;
                                    overflow-y: auto; }
                            #grid.misc > .tile {
                              flex-basis: calc((100% - 12px) / 2); } }

.tile {
  background: var(--tile);
  border: 2px solid var(--edge);
  border-radius: 18px;
  display: flex; flex-direction: column; justify-content: center;
  align-items: center; gap: 6px;
  padding: 18px 12px;
  cursor: pointer;
  transition: transform .12s ease, opacity .2s;
}
.tile:active { transform: scale(.96); }
/* The icons are stroked line drawings, so they take the ink colour and
   need no second copy for the black theme -- same trick as her face. */
.tile .big { line-height: 0; }
.tile .big svg {
  width: 46px; height: 46px;
  fill: none; stroke: var(--ink); stroke-width: 1.6;
  stroke-linecap: round; stroke-linejoin: round;
}
/* A TWO-TILE VIEW gives each tile half the panel, and a 46px icon
   floats in the middle of that looking lost. Scaled to the room they
   actually have -- caught by rendering it, not by reading the CSS.
   ☆Misc☆ keeps 46px, where six tiles make that right.

   BOTH two-tile views take it, not just the front one. ☆Stuff☆ holds
   two tiles for exactly the same reason the front page does, and a
   rule that names one layout and not its twin is how `#saya`'s 72px
   outlived the page it was written for. */
#grid.main .tile .big svg,
#grid.stuff .tile .big svg { width: 76px; height: 76px; }
#grid.main .tile b, #grid.stuff .tile b { font-size: 26px; }
#grid.main .tile span, #grid.stuff .tile span { font-size: 15px; }
/* SAYA'S ICON IS NOT BIGGER THAN THE OTHERS ANY MORE. That 72px was
   right while she was the one named tile on a front page of four; she
   is now one of four PEERS inside the A.I. drawer, and equal thumb
   targets want equal icons. A rule that outlived the layout it was
   written for is the same fault as a hardcoded cast, one size down. */
.tile b { font-size: 17px; font-weight: 700; }
.tile span { font-size: 12.5px; opacity: .6; text-align: center; }
.tile.busy { opacity: .55; }
/* Armed: the first tap said how big the save is, and the next one
   saves it. Lit like the front tile so the state reads at a glance. */
#save.armed { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

/* THE FRONT CHARACTER IS THE BRIGHT TILE -- by ROLE, never by name.
   This used to be `#saya`, which is the hardcoded-cast bug in
   stylesheet form: the day the front door is somebody else, the glow
   stays on a tile that has moved into a drawer. `.lead` is put on
   whichever roster entry carries `front`, so the highlight follows
   `FRONT` in yuzu_face.py the way everything else on this deck
   follows the roster. */
.lead { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

/* ---- bottom: what a tap is doing ---------------------------------- */
#bar {
  display: flex; align-items: center; gap: 14px;
  padding: 0 20px calc(16px + env(safe-area-inset-bottom));
}
/* `min-width: 0` is the load-bearing half, and rendering is what said
   so: a flex item will not shrink below its own longest word without
   it, so a long verdict here pushed the row wider than the screen and
   clipped the LAST button off the right edge -- measured at 412px, the
   Update button's right edge landed at 414. Exactly the fault that put
   the ⌂ 169px past the viewport on four character pages. The bar's
   buttons keep their corner; the message takes what is left. */
#note { flex: 1; min-width: 0; overflow: hidden;
         font-size: 13px; opacity: .75; min-height: 1.2em;
         white-space: pre-line; line-height: 1.45; }
/* UPDATE LIVES IN THE BAR FOR THE REASON BACK DOES. He means to "pile
   up our fancy future apps" in the drawer, so a tile spends an app slot
   forever and MOVES every time the drawer grows -- and seven tiles in
   three columns orphans one onto a row of its own, which is the layout
   bug this page has now had twice. In the bar it is in the same place
   whatever is on screen, and it is maintenance rather than an app. */
#update, #desktop {
  flex: none;
  font: inherit; font-weight: 700; font-size: 13px;
  color: var(--ink); background: var(--tile); cursor: pointer;
  border: 2px solid var(--edge); border-radius: 4px; padding: 7px 14px;
}
/* The margin is on the FIRST of the pair, not on each of them, or the
   second one is shoved off the right edge on a narrow screen -- which
   is the fault that put the ⌂ 169px past the viewport on four
   character pages. */
#desktop { margin-left: auto; }
#update:disabled, #desktop:disabled { opacity: .5; cursor: default; }
/* ON A PHONE THE MESSAGE GETS ITS OWN LINE, above the buttons. Side by
   side it was squeezed to one word wide and half the screen tall -- the
   fault the rule above records -- and "Save my stuff" says a whole
   sentence (what is in the save), which at 360px made the bar so tall
   it pushed the drawer's last row out of sight and wrapped ⌂ Back onto
   two lines. Found by rendering, Sept 29. An empty message takes no
   line at all, so the bar is its old height until something is said. */
/* And the gaps shrink to fit a 360px phone: Back, Desktop and Update
   side by side came to 368px there, so in a drawer Update used to sit
   off the edge, and with wrapping it fell to a third row instead. */
@media (max-width: 560px) {
  #bar { flex-wrap: wrap; row-gap: 8px; column-gap: 8px;
         padding-left: 16px; padding-right: 16px; }
  #note { flex: 0 0 100%; order: -1; }
  #note:empty { display: none; }
}

/* Pure #000 also kills glare on a panel and hides the bezel edge,
   which is the practical half of why green on black is worth having on
   a handheld rather than just the good-looking half. */
.tile { border-radius: 4px; }
</style>

<div id="top">
  <div id="clock">--:--</div>
  <div id="date"></div>
  <div id="warn">clock not set — no network yet</div>
  <div id="batt"></div>
</div>

<style id="aicols"></style>
<div id="grid" class="main">
  <!-- THE FRONT PAGE IS ONE CHARACTER AND ONE DRAWER. Ghost, Sept 15:
       "i wana put the Ais in the misc drawer and maybe have 1 specific
       one take over", then the layout in his own words: "Rename the
       outer front page drawer to ☆Stuff☆ so layout Homescreen (central
       new undecided ai and ☆stuff☆ > inside stuff theres ai tab and
       misc tab with the rest of the stuff in that one."

       So it is three levels deep now:

           home     <the front character>   ☆Stuff☆
           ☆Stuff☆  A.I.                    ☆Misc☆
           ☆Misc☆   Wikipedia  Game Boy  Save my stuff
           A.I.     built from the roster

       THE FRONT TILE IS NOT IN THIS FILE, and that is the whole
       lesson of the round before this one. Mimi shipped with a page, a
       persona and a rail entry and was INVISIBLE from this screen,
       because the cast was typed here -- "she also was only found by
       clicking cait 1st then finding her name lmao". A hardcoded front
       door is the same bug with a shorter list: it goes stale the day
       Ghost picks his new main. The tile is built from whichever roster
       entry carries `front`, which is `FRONT` in yuzu_face.py, one line
       to move. Nothing below names a character.

       STILL THE SAME PAGE, with the tiles swapped three ways rather
       than two. A new file would need its own way out, and every screen
       on this deck having an exit is the rule two power cycles paid
       for. -->
  <div class="tile" id="stuff" data-view="main" data-show="stuff">
    <div class="big"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 12h17"/><path d="M10 8.2h4M10 15.8h4"/></svg></div>
    <b class="stars">☆Stuff☆</b>
    <span>the rest of the deck</span>
  </div>

  <div class="tile" id="ai" data-view="stuff" data-show="ai">
    <div class="big"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.4" r="3.3"/><path d="M6 19.8c0-3.4 2.7-5.2 6-5.2s6 1.8 6 5.2"/><circle cx="4.5" cy="7.6" r="2.1"/><path d="M1.2 16.6c0-2.2 1.3-3.7 3.3-3.7"/><circle cx="19.5" cy="7.6" r="2.1"/><path d="M22.8 16.6c0-2.2-1.3-3.7-3.3-3.7"/></svg></div>
    <b>A.I.</b>
    <span>everyone who talks back</span>
  </div>
  <div class="tile" id="misc" data-view="stuff" data-show="misc">
    <div class="big"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><path d="M17 13.8v6.4M13.8 17h6.4"/></svg></div>
    <b class="stars">☆Misc☆</b>
    <span>everything else</span>
  </div>

  <div class="tile" data-view="misc" data-launch="wiki">
    <div class="big"><svg viewBox="0 0 24 24"><path d="M12 6.5C10.5 5 8.5 4.5 4 4.5v13c4.5 0 6.5.5 8 2 1.5-1.5 3.5-2 8-2v-13c-4.5 0-6.5.5-8 2z"/><path d="M12 6.5v13"/></svg></div>
    <b>Wikipedia</b>
    <span>offline</span>
  </div>
  <div class="tile" data-view="misc" data-launch="gba">
    <div class="big"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="4"/><path d="M7 10.5v4M5 12.5h4"/><path d="M16 11.5h.01M18.5 14h.01"/></svg></div>
    <b>Game Boy</b>
    <span>newest ROM</span>
  </div>
  <!-- SAVE MY STUFF. Ghost, Sept 29: "I dont wana hit it and auto fill
       my phones memory lol. Just make it save whats important". So it
       saves the girls' memories, his notes and his game saves -- and,
       since Sept 30, when he asked, the girls' brains -- and the FIRST
       tap only says how big that is; the second tap saves it. See
       save_plan() in yuzu_face.py.
       A tile rather than a bar button: the bar already carries Back,
       Desktop and Update, and on a phone one more button there is the
       fault that once put Update 2px off a 412px screen. -->
  <div class="tile" id="save" data-view="misc" data-save="">
    <div class="big"><svg viewBox="0 0 24 24"><path d="M12 3.5v11"/><path d="m7.5 10 4.5 4.5 4.5-4.5"/><path d="M4 15.5v4h16v-4"/></svg></div>
    <b>Save my stuff</b>
    <span>chats, saves &amp; brains</span>

</div>

<div id="bar">
  <button id="back" type="button">⌂ Back</button>
  <div id="note"></div>
  <button id="desktop" type="button"
          title="put the deck's app icons on the board's own desktop"
          >⊞ Desktop</button>
  <button id="update" type="button" title="git pull">↻ Update</button>
</div>

<script>
// THERE IS NO COLOUR CONTROL. "only use the cool green on black crt
// for ui" -- so the palette is two CSS variables at the top of this
// file and nothing on screen offers to change them.

// ---- clock ---------------------------------------------------------
// 1969 on screen is the board telling you it has not reached NTP yet.
// Naming that beats a clock that is quietly, confidently wrong.
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toTimeString().slice(0, 5);
  document.getElementById('date').textContent =
    now.toDateString();
  document.getElementById('warn').style.display =
    now.getFullYear() < 2000 ? 'block' : 'none';
}
tick();
setInterval(tick, 20000);

// ---- the battery ----------------------------------------------------
// THIS DECK CANNOT SEE A PERCENTAGE TODAY and does not pretend to. The
// power path is a PD bank -> a barrel jack, and a barrel jack carries
// volts and nothing else: no data line, no fuel gauge, no state of
// charge. So there are exactly two honest displays and one absence:
//
//   a real battery node   ->  the kernel's percentage. Appears by
//                             itself the day a UPS HAT is added.
//   the Jetson's own rail ->  WATTS being drawn, measured, right now,
//                             plus hours FROM FULL at that draw.
//   neither               ->  nothing at all.
//
// "~4.1h/full" is worded that way on purpose. It is not hours
// REMAINING -- remaining needs a state of charge nothing here can read,
// and inventing one is the confident lie this project keeps refusing.
//
// Identical in home.html, deliberately: two pages, no build step, and a
// test asserts the two copies agree.
function charge(box, s) {
  if (typeof s.percent === 'number') {
    box.innerHTML = '<i class="cell"><b></b></i>';
    box.querySelector('b').style.width = s.percent + '%';
    box.append(s.percent + '%' + (s.charging ? ' chg' : ''));
    box.classList.toggle('low', s.percent < 20 && !s.charging);
    return;
  }
  box.classList.remove('low');
  box.textContent = s.watts
    ? s.watts + 'W' + (s.hours ? '  ·  ~' + s.hours + 'h/full' : '')
    : '';
}

function power() {
  fetch('stats', { cache: 'no-store' })
    .then(r => r.json())
    .then(s => charge(document.getElementById('batt'), s))
    .catch(() => {})
    .then(() => setTimeout(power, 10000));
}
power();

// ---- launching -----------------------------------------------------
// A tap that appears to do nothing is the worst outcome on a
// touchscreen -- it reads as a broken deck. So every tile says what it
// is doing, and says it for long enough to be read.
const note = document.getElementById('note');
function say(text, ms) {
  note.textContent = text;
  if (ms) setTimeout(() => { if (note.textContent === text) note.textContent = ''; }, ms);
}

const grid = document.getElementById('grid');

// ---- SAVE MY STUFF ---------------------------------------------------
// Ghost, Sept 29: "I dont wana hit it and auto fill my phones memory
// lol." So the FIRST tap only asks the deck what it would save and how
// big that is, and says so; the SECOND tap saves it. It disarms itself
// if he does nothing, like start fresh on Four's page -- slower here,
// because he has a size and a list to read first. No dialog: a modal is
// a mode, and a mode needs its own way out.
//
// THE SECOND TAP IS A PLAIN LINK, NOT A FETCH, since the girls' brains
// went in (Sept 30: "can you make the save button save the ai models
// too?"). A fetch holds the whole file in the page before handing it
// over, and a 4GB save does not fit in a phone browser's memory. A link
// hands it straight to the phone's own downloader, which shows progress,
// keeps going with the page closed, and says "Failed" if the WiFi drops
// -- the server sends the exact length, so a save cut short can never
// pass for a whole one. Why it could not build one is already answered
// by the FIRST tap, which is where he reads.
let saveArmed = null, saveAs = 'yuzu-save.tar';
const SAVE_IDLE = 'chats, saves & brains';

function unarm(tile) {
  clearTimeout(saveArmed);
  saveArmed = null;
  tile.classList.remove('armed');
  tile.querySelector('span').textContent = SAVE_IDLE;
}

function saveMyStuff(tile) {
  if (tile.classList.contains('busy')) return;
  const out = tile.querySelector('span');
  if (!saveArmed) {
    tile.classList.add('busy');
    fetch('save.json', { cache: 'no-store' })
      .then(r => r.json())
      .then(m => {
        if (!m.ok) { say(m.said || 'Nothing to save yet.', 12000); return; }
        saveAs = m.name || saveAs;
        out.textContent = m.size + ' · tap again to save';
        tile.classList.add('armed');
        say(m.what, 15000);
        saveArmed = setTimeout(() => unarm(tile), 15000);
      })
      .catch(() => say('No answer from the deck. Is ~/YUZU/face running?', 9000))
      .then(() => tile.classList.remove('busy'));
    return;
  }
  unarm(tile);
  const a = document.createElement('a');
  a.href = 'save.tar';
  a.download = saveAs;
  document.body.appendChild(a);
  a.click();
  a.remove();
  say('Saving ' + saveAs + ' -- your phone shows it downloading. It is '
      + 'only safe once it says Complete.', 15000);
}

// Wiring is a FUNCTION, not a one-shot loop over what is in the
// markup: the A.I. tiles are built from the roster after this runs, and
// a tile nobody wired is a tap that does nothing -- which reads as a
// broken deck.
function wire(tile) {
  tile.onclick = () => {
    if ('save' in tile.dataset) { saveMyStuff(tile); return; }
    // A view swap is not a launch and not a link -- it is the drawer
    // opening. Kept as its own verb so `data-launch` stays exactly the
    // allowlisted-name-crosses-the-wire thing it has always been.
    const view = tile.dataset.show;
    if (view) { grid.className = view; say(''); return; }

    const go = tile.dataset.go;
    if (go) { location.href = go; return; }

    const what = tile.dataset.launch;
    if (tile.classList.contains('busy')) return;
    tile.classList.add('busy');
    say('Starting ' + tile.querySelector('b').textContent + '...');

    fetch('launch/' + what, { method: 'POST' })
      .then(r => r.json())
      .then(r => {
        tile.classList.remove('busy');
        if (r.ok) {
          say(r.said || 'Started. Look at the screen.', 6000);
          if (r.open) location.href = r.open;
        } else {
          say(r.said || 'It would not start.', 9000);
        }
      })
      .catch(() => {
        tile.classList.remove('busy');
        say('No answer from the deck. Is ~/YUZU/face running?', 9000);
      });
  };
}

document.querySelectorAll('.tile').forEach(wire);

// NO VIEW MAY END ON A ROW WITH A HOLE IN IT, and this is the only view
// whose tile count is unknown when the file is written. Four goes in a
// 2x2; five goes three-then-two, the two CENTRED under the three (see
// where this is used), which is a short row rather than a lone orphan.
// That orphan is the `auto-fit` bug a screenshot caught on the very
// first home screen, and that a fifth tile brought back once.
function columnsFor(n) {
  return n % 3 === 0 ? 3 : n % 2 === 0 ? 2 : 3;
}

// ONE BUILDER, TWO PLACES SHE CAN APPEAR. The front door and the
// drawer are the same tile with a different view on it, so there is no
// second copy to forget -- the same reason there is no second list.
function character(c, view) {
  const tile = document.createElement('div');
  tile.className = 'tile';
  tile.setAttribute('data-view', view);
  tile.dataset.go = c.page;
  tile.innerHTML =
    '<div class="big"><svg viewBox="0 0 24 24">' +
    (FACES[c.who] || FACES._) + '</svg></div><b></b><span></span>';
  // textContent, never innerHTML, for anything that came off the
  // wire. The roster is this deck's own, but the rule costs nothing.
  tile.querySelector('b').textContent = c.name;
  tile.querySelector('span').textContent = c.blurb;
  wire(tile);
  return tile;
}

fetch('characters.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(list => {
    document.getElementById('ai').querySelector('span').textContent =
      list.length + ' of them';
    list.forEach(c => grid.appendChild(character(c, 'ai')));

    // THE FRONT DOOR, and it goes FIRST rather than appended -- the
    // character he meets is on the left, ☆Stuff☆ is beside her.
    //
    // SHE IS STILL IN THE A.I. DRAWER TOO, on purpose. Being the front
    // tile is a shortcut, not a filing cabinet: a character who
    // vanished from the roster because she was promoted would be the
    // Mimi bug pointing the other way.
    const lead = list.filter(c => c.front)[0];
    if (lead) {
      const tile = character(lead, 'main');
      tile.classList.add('lead');
      grid.insertBefore(tile, grid.firstChild);
    }

    // A DEAD ROSTER COSTS THE CHARACTER AND NEVER COSTS THE WAY IN.
    // ☆Stuff☆ is in the markup and works with no server at all, so the
    // front page falls back to one tile across rather than one tile
    // sitting in half a screen. Same call as Yuzu's wardrobe button.
    // AN ICON IS SIZED BY HOW MUCH ROOM ITS TILE HAS, and this is the
    // one view whose tile count is not known when this file is
    // written -- so it is the one view whose icon size cannot be a
    // static rule either. Cutting the cast to two left each tile
    // holding half the panel with a 46px icon floating in the middle
    // of it: the IDENTICAL fault a screenshot caught on the two-tile
    // front page, in the one view that was still naming a layout it
    // could no longer be sure of. The comment beside that static rule
    // says it outright -- "a rule that names one layout and not its
    // twin is how #saya's 72px outlived the page it was written for".
    //
    // So it rides on the number that already decides the layout,
    // emitted in the same breath, rather than on a second list.
    //
    // AND THE SHORT LAST ROW IS CENTRED, the way the ☆Misc☆ drawer's
    // is. Five characters left a hole in the bottom right the day Shiro
    // and Kuro arrived (Sept 26) -- three columns, then two tiles
    // hugging the left -- found by rendering the drawer, not by any
    // assertion. A wrapping row of tiles each 1/cols wide, centred,
    // keeps every tile the size the grid gave it and turns the short
    // row into a deliberate one.
    const cols = columnsFor(list.length);
    document.getElementById('aicols').textContent =
      '#grid.ai { display: flex; flex-wrap: wrap; justify-content: center;' +
      ' align-content: stretch; }' +
      ' #grid.ai > .tile { flex: 0 0 calc((100% - ' + (cols - 1) +
      ' * 12px) / ' + cols + '); }' +
      ' @media (max-width: 560px) { #grid.ai > .tile { flex-basis: 100%; } }' +
      (cols === 2
        ? ' #grid.ai .tile .big svg { width: 76px; height: 76px; }' +
          ' #grid.ai .tile b { font-size: 26px; }' +
          ' #grid.ai .tile span { font-size: 15px; }'
        : '') +
      (lead ? '' : ' #grid.main { grid-template-columns: 1fr; }');
  })
  .catch(() => {
    const gone = document.createElement('div');
    gone.className = 'tile';
    gone.setAttribute('data-view', 'ai');
    gone.innerHTML = '<b>No answer</b><span>start ~/YUZU/face</span>';
    grid.appendChild(gone);
    document.getElementById('aicols').textContent =
      '#grid.main { grid-template-columns: 1fr; }';
  });

// ---- updating, without the cable -------------------------------------
// Ghost, Sept 15: "And can i make her pull the current that way? Idk
// how to use my phone wirelessly with it."
//
// Everything else on this deck already reaches him over WiFi. `git
// pull` was the last thing that needed the one shell he can only get
// by plugging his phone into the board -- and it is the thing he runs
// most often, so the update loop was what kept the deck tethered.
//
// THE VERDICT GOES IN THE BAR, which is where he is already looking
// after tapping. `pull` puts its answer on the first line on purpose --
// UPDATED / ALREADY UP TO DATE / PULL FAILED -- and names the fix
// underneath when it fails, so the first few lines ARE the whole
// message.
const update = document.getElementById('update');
update.onclick = () => {
  update.disabled = true;
  update.textContent = '...';
  say('Pulling. This can take a moment on a cold board.');

  fetch('pull', { method: 'POST' })
    .then(r => r.json())
    .then(r => {
      const text = (r.said || '').trim();
      // The first lines are the verdict and, when it failed, the fix.
      say(text.split('\n').filter(l => l.trim()).slice(0, 4).join('\n'));
      // `restarting` from the server; UPDATED. for one that predates it.
      if (r.restarting || text.indexOf('UPDATED.') >= 0) {
        // HER SERVER IS RESTARTING ITSELF behind this reply, so the
        // page has to wait for it rather than reloading into a dead
        // port. A reload that lands on "unable to connect" reads as an
        // update that broke the deck.
        //
        // AND "SOMETHING ANSWERED" IS NOT "THE NEW ONE IS UP". This
        // used to reload on the first answer, which came from the OLD
        // server -- it lives two more seconds before it restarts -- so
        // every update reloaded into the version it had just replaced.
        // The server that answered the pull says who it is (`boot`);
        // the page waits for /boot.json to name a DIFFERENT one. An
        // older server has no /boot.json at all, so any answer there
        // is the new one.
        update.textContent = 'restarting';
        const was = r.boot || '';
        let tries = 0;
        const gaveUp = () => {
          clearInterval(wait);
          update.disabled = false; update.textContent = '↻ Update';
          say('Updated, but her server has not come back. '
              + 'Start it with ~/YUZU/face', 15000);
        };
        const wait = setInterval(() => {
          fetch('boot.json', { cache: 'no-store' })
            .then(res => (res.ok ? res.json() : null))
            .then(now => {
              if (now && now.boot && now.boot !== was) {
                clearInterval(wait); location.reload();
              } else if (++tries > 30) gaveUp();
            })
            .catch(() => { if (++tries > 30) gaveUp(); });
        }, 1000);
        return;
      }
      update.disabled = false;
      update.textContent = '↻ Update';
    })
    .catch(() => {
      update.disabled = false;
      update.textContent = '↻ Update';
      say('No answer from the deck. Is ~/YUZU/face running?', 9000);
    });
};

// ---- the deck, as an app on the board's own desktop -----------------
// Ghost, Sept 17: "i want a button on that gnome desktop that opens a
// window with this part in it if possible? I just dislike using
// terminals honestly" -- and then "Like fully a window not a browser
// tab."
//
// THE WINDOW ALREADY EXISTED. `deckapps` writes .desktop files that
// open these pages with --app= --start-fullscreen: no tab strip, no
// url bar, no window edge. The part that needed a keyboard was
// INSTALLING them, and his one shell is a serial cable -- so this is
// the same maintenance-not-an-app call Update already made, one seat
// along in the same bar.
//
// He can tap it from the phone. The icons land on the board whether or
// not a monitor is plugged in.
const desktop = document.getElementById('desktop');
desktop.onclick = () => {
  desktop.disabled = true;
  desktop.textContent = '...';
  say('Putting the icons out.');
  fetch('icons', { method: 'POST' })
    .then(r => r.json())
    .then(r => {
      const text = (r.said || '').trim();
      say(text.split('\n').filter(l => l.trim()).slice(0, 4).join('\n'),
          r.ok ? 12000 : 20000);
      desktop.disabled = false;
      desktop.textContent = '⊞ Desktop';
    })
    .catch(() => {
      desktop.disabled = false;
      desktop.textContent = '⊞ Desktop';
      say('No answer from the deck. Is ~/YUZU/face running?', 9000);
    });
};

// ---- getting out ----------------------------------------------------
// One Back, in the bottom bar, in the same place whatever is on screen.
// It walks DOWN one level rather than remembering a history, because a
// stack can strand you and this deck has no keyboard to escape with.
//
// IT IS A MAP NOW BECAUSE THE DECK IS THREE DEEP. The old ternary read
// "calc goes to misc, everything else goes home", which was true while
// home was one hop from everywhere. With ☆Stuff☆ in between, "go home"
// from the drawer would skip a level he walked down on purpose. Every
// view names its parent, `main` is its own, so repeated taps always
// land at the front and can never loop. (The calculator was the fourth
// level; it went with the robot, Sept 30.)
const PARENT = { misc: 'stuff', ai: 'stuff', stuff: 'main', main: 'main' };
document.getElementById('back').onclick = () => {
  grid.className = PARENT[grid.className] || 'main';
  say('');
};
</script>
