<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deck</title>
<!--
  The home screen. Ghost, Sept 10: "id like home button to take me to a
  desktop with my apps and a saya button visible."

  This is the thing the ⌂ on her face goes to, and the thing the deck
  boots into. Big touch targets, no text entry anywhere, no scrolling
  on 1024x600.

  A WEB PAGE CANNOT START mGBA. That is the one real problem here, and
  the answer is a POST to `/launch/<name>` which yuzu_face.py runs
  against a HARD-CODED ALLOWLIST -- three names, no arguments from the
  page, nothing that can become "run this string". Anything else is a
  local web server that executes what it is told, on a board sitting on
  his WiFi.

  ONE LOOK. Ghost, Sept 11: "id like it removed. only use the cool
  green on black crt for ui." The swatches are gone from both screens
  and there is no control for it anywhere -- the exception, on purpose,
  is the V-Pet page, which is its own little world in full colour.

  The icons are line drawings in this file, not emoji. Ghost wanted
  "clean single-color line icons... rather than smartphone", and the
  libraries that ship them (Lucide, Feather) are a download -- so these
  are drawn here, four paths, no dependency, any colour.

  No network, no fonts, no libraries.
-->
<style>
:root {
  --bg:   #000000;
  --ink:  #39ff5e;
  --tile: rgba(13,13,17,.85);
  --edge: color-mix(in srgb, var(--ink) 45%, transparent);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100vh; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px system-ui, -apple-system, sans-serif;
  transition: background .45s ease;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  display: flex; flex-direction: column;
}

/* ---- top bar: the clock, and nothing else -------------------------
   The board has no RTC and starts at 1969 until NTP lands, so a wrong
   clock here is a KNOWN state rather than a bug -- see CLAUDE.md. It
   is still worth showing: it is the fastest way to notice the board
   has not reached the network yet.                                  */
#top {
  display: flex; align-items: baseline; gap: 12px;
  padding: 14px 20px 4px;
}
#clock { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
#date  { font-size: 14px; opacity: .65; }
#warn  { margin-left: auto; font-size: 13px; font-weight: 600;
         opacity: .8; display: none; }
/* The battery sits with the clock, because that is where a handheld
   wears it. A DRAWN cell rather than an emoji: an emoji is a
   full-colour bitmap that would ignore --ink and sit on the black
   theme as a glossy blob. */
#batt { margin-left: auto; font-size: 14px; font-weight: 600; opacity: .85; }
#warn:not([style*="none"]) ~ #batt { margin-left: 12px; }
.cell {
  display: inline-block; vertical-align: -2px;
  width: 24px; height: 12px; margin-right: 5px;
  border: 1.5px solid currentColor; border-radius: 3px;
  position: relative;
}
.cell::after {
  content: ''; position: absolute; right: -4px; top: 3px;
  width: 2.5px; height: 6px; background: currentColor;
  border-radius: 0 1px 1px 0;
}
.cell b { display: block; height: 100%; background: currentColor; }
#batt.low { color: #ff4d6a; }

/* ---- the tiles ---------------------------------------------------- */
/* 2x2, filling the screen. The first layout used auto-fit and left
   Game Boy orphaned on a row of its own with half the panel empty --
   caught by screenshotting it at the panel's real 1024x600 rather than
   by reading the CSS. Same rule as the art: look at it. */
#grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  grid-auto-rows: 1fr;
  gap: 12px;
  padding: 8px 20px 14px;
  min-height: 0;
}
/* ---- two views, one grid -----------------------------------------
   Ghost, Sept 11: "lets hide the gameboy tab for now its not as
   important. or put it and the wikipedia tabs under a tab called
   ☆Misc☆ we can pile up our fancy future apps in that tab."

   So the front page is the four things he actually opens and ☆Misc☆ is
   the drawer. It is the SAME PAGE with the tiles swapped rather than a
   second file: a new page would need its own way out, and every screen
   on this deck having an exit is the rule two power cycles paid for.
   Here the ⌂ tile IS that exit and it goes back to the front page.

   It also puts the grid back to four equal thumb targets, which is
   what it was before the fifth tile forced a spanning row. */
[data-view] { display: none !important; }
#grid.main [data-view="main"], #grid.misc [data-view="misc"] {
  display: flex !important;
}
#back .big { font-size: 30px; line-height: 1; }
.stars { letter-spacing: .06em; }

/* ---- the d20 ------------------------------------------------------
   Ghost: "add a D20 dice button somewhere with that black and neon
   green crt effects that rolls it randomly."

   It rolls IN PLACE. A dice roller that needs a page of its own is a
   dice roller nobody taps, and this deck already has enough screens
   with exits to get right. */
#d20 .roll {
  font-size: 46px; font-weight: 800; line-height: 1;
  letter-spacing: .02em; font-variant-numeric: tabular-nums;
}
#d20.rolling .roll { opacity: .55; }
/* The CRT flourish, and it is only ever on the two numbers that
   deserve one. A glow on every result is just a bright tile. */
#d20.nat20 { border-color: var(--ink); }
#d20.nat20 .roll { text-shadow: 0 0 10px var(--ink), 0 0 26px var(--ink); }
#d20.nat1 { border-color: #ff4d6a; }
#d20.nat1 .roll { color: #ff4d6a;
                  text-shadow: 0 0 10px #ff4d6a, 0 0 26px #ff4d6a; }
@keyframes crt {
  0%   { transform: scaleY(1);    filter: brightness(1) }
  18%  { transform: scaleY(1.06); filter: brightness(2.2) }
  34%  { transform: scaleY(.97);  filter: brightness(.7) }
  60%  { transform: scaleY(1.02); filter: brightness(1.5) }
  100% { transform: scaleY(1);    filter: brightness(1) }
}
#d20.settled .roll { animation: crt .42s ease-out; }
@media (max-width: 560px) { #grid { grid-template-columns: 1fr; } }
.tile {
  background: var(--tile);
  border: 2px solid var(--edge);
  border-radius: 18px;
  display: flex; flex-direction: column; justify-content: center;
  align-items: center; gap: 6px;
  padding: 18px 12px;
  cursor: pointer;
  transition: transform .12s ease, opacity .2s;
}
.tile:active { transform: scale(.96); }
/* The icons are stroked line drawings, so they take the ink colour and
   need no second copy for the black theme -- same trick as her face. */
.tile .big { line-height: 0; }
.tile .big svg {
  width: 46px; height: 46px;
  fill: none; stroke: var(--ink); stroke-width: 1.6;
  stroke-linecap: round; stroke-linejoin: round;
}
#saya .big svg { width: 58px; height: 58px; }
.tile b { font-size: 17px; font-weight: 700; }
.tile span { font-size: 12.5px; opacity: .6; text-align: center; }
.tile.busy { opacity: .55; }

/* Her tile is the one he asked for by name, so it is the bright one --
   same size as the rest, because equal targets are what a thumb wants,
   but unmistakably the main thing. */
#saya { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

/* ---- bottom: what a tap is doing ---------------------------------- */
#bar {
  display: flex; align-items: center; gap: 10px;
  padding: 0 20px calc(16px + env(safe-area-inset-bottom));
}
#note { font-size: 13px; opacity: .75; min-height: 1.2em; }

/* Pure #000 also kills glare on a panel and hides the bezel edge,
   which is the practical half of why green on black is worth having on
   a handheld rather than just the good-looking half. */
.tile { border-radius: 4px; }
</style>

<div id="top">
  <div id="clock">--:--</div>
  <div id="date"></div>
  <div id="warn">clock not set — no network yet</div>
  <div id="batt"></div>
</div>

<div id="grid" class="main">
  <div class="tile" id="saya" data-view="main" data-go="face.html">
    <div class="big"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="13" rx="3"/><path d="M9 2v4M15 2v4"/><path d="M9 12h.01M15 12h.01"/><path d="M9.5 15.5h5"/></svg></div>
    <b>Saya</b>
    <span>her face</span>
  </div>
  <div class="tile" data-view="main" data-launch="chat">
    <div class="big"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 9l3 2.5L7 14"/><path d="M12.5 14.5H17"/></svg></div>
    <b>Talk</b>
    <span>chat with her</span>
  </div>
  <div class="tile" id="pet" data-view="main" data-go="vpet.html">
    <div class="big"><svg viewBox="0 0 24 24"><path d="M12 20c-4 0-6.5-2.2-6.5-5.5C5.5 11 8 8.5 12 8.5s6.5 2.5 6.5 6c0 3.3-2.5 5.5-6.5 5.5z"/><path d="M8 8.2 6.6 4.5 9.6 6M16 8.2 17.4 4.5 14.4 6"/><path d="M10 14h.01M14 14h.01"/></svg></div>
    <b>Pet</b>
    <span>he lives here</span>
  </div>
  <div class="tile" id="misc" data-view="main" data-show="misc">
    <div class="big"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><path d="M17 13.8v6.4M13.8 17h6.4"/></svg></div>
    <b class="stars">☆Misc☆</b>
    <span>everything else</span>
  </div>

  <div class="tile" data-view="misc" data-launch="wiki">
    <div class="big"><svg viewBox="0 0 24 24"><path d="M12 6.5C10.5 5 8.5 4.5 4 4.5v13c4.5 0 6.5.5 8 2 1.5-1.5 3.5-2 8-2v-13c-4.5 0-6.5.5-8 2z"/><path d="M12 6.5v13"/></svg></div>
    <b>Wikipedia</b>
    <span>offline</span>
  </div>
  <div class="tile" data-view="misc" data-launch="gba">
    <div class="big"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="4"/><path d="M7 10.5v4M5 12.5h4"/><path d="M16 11.5h.01M18.5 14h.01"/></svg></div>
    <b>Game Boy</b>
    <span>newest ROM</span>
  </div>
  <div class="tile" id="d20" data-view="misc" data-roll="20">
    <div class="big"><svg viewBox="0 0 24 24"><path d="M12 2.2 20.5 7v10L12 21.8 3.5 17V7z"/><path d="m12 2.2 5 7.3-5 8-5-8z"/><path d="M7 9.5 3.5 7M17 9.5 20.5 7M12 17.5V21.8"/></svg></div>
    <b>d20</b>
    <span class="roll"></span>
  </div>
  <div class="tile" id="back" data-view="misc" data-show="main">
    <div class="big">⌂</div>
    <b>Back</b>
    <span>to the front page</span>
  </div>
</div>

<div id="bar">
  <div id="note"></div>
</div>

<script>
// THERE IS NO COLOUR CONTROL. "only use the cool green on black crt
// for ui" -- so the palette is two CSS variables at the top of this
// file and nothing on screen offers to change them. The one page
// allowed to break the rule is vpet.html, deliberately.

// ---- clock ---------------------------------------------------------
// 1969 on screen is the board telling you it has not reached NTP yet.
// Naming that beats a clock that is quietly, confidently wrong.
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toTimeString().slice(0, 5);
  document.getElementById('date').textContent =
    now.toDateString();
  document.getElementById('warn').style.display =
    now.getFullYear() < 2000 ? 'block' : 'none';
}
tick();
setInterval(tick, 20000);

// ---- the battery ----------------------------------------------------
// THIS DECK CANNOT SEE A PERCENTAGE TODAY and does not pretend to. The
// power path is a PD bank -> a barrel jack, and a barrel jack carries
// volts and nothing else: no data line, no fuel gauge, no state of
// charge. So there are exactly two honest displays and one absence:
//
//   a real battery node   ->  the kernel's percentage. Appears by
//                             itself the day a UPS HAT is added.
//   the Jetson's own rail ->  WATTS being drawn, measured, right now,
//                             plus hours FROM FULL at that draw.
//   neither               ->  nothing at all.
//
// "~4.1h/full" is worded that way on purpose. It is not hours
// REMAINING -- remaining needs a state of charge nothing here can read,
// and inventing one is the confident lie this project keeps refusing.
//
// Identical in home.html, deliberately: two pages, no build step, and a
// test asserts the two copies agree.
function charge(box, s) {
  if (typeof s.percent === 'number') {
    box.innerHTML = '<i class="cell"><b></b></i>';
    box.querySelector('b').style.width = s.percent + '%';
    box.append(s.percent + '%' + (s.charging ? ' chg' : ''));
    box.classList.toggle('low', s.percent < 20 && !s.charging);
    return;
  }
  box.classList.remove('low');
  box.textContent = s.watts
    ? s.watts + 'W' + (s.hours ? '  ·  ~' + s.hours + 'h/full' : '')
    : '';
}

function power() {
  fetch('stats', { cache: 'no-store' })
    .then(r => r.json())
    .then(s => charge(document.getElementById('batt'), s))
    .catch(() => {})
    .then(() => setTimeout(power, 10000));
}
power();

// ---- launching -----------------------------------------------------
// A tap that appears to do nothing is the worst outcome on a
// touchscreen -- it reads as a broken deck. So every tile says what it
// is doing, and says it for long enough to be read.
const note = document.getElementById('note');
function say(text, ms) {
  note.textContent = text;
  if (ms) setTimeout(() => { if (note.textContent === text) note.textContent = ''; }, ms);
}

const grid = document.getElementById('grid');

// ---- the d20 --------------------------------------------------------
// FAIR, not just random-looking. crypto.getRandomValues with the top of
// the range thrown away removes the modulo bias you get from
// `random() % 20` -- it costs nothing and a loaded die is a bad joke to
// leave in a thing somebody rolls for fun.
function d(sides) {
  const limit = 256 - (256 % sides);
  const byte = new Uint8Array(1);
  do { crypto.getRandomValues(byte); } while (byte[0] >= limit);
  return (byte[0] % sides) + 1;
}

function roll(tile, sides) {
  if (tile.classList.contains('rolling')) return;
  const out = tile.querySelector('.roll');
  tile.className = tile.className.replace(/ (nat20|nat1|settled|rolling)/g, '');
  tile.classList.add('rolling');
  // Tumble first. A number that simply appears has not been ROLLED,
  // and the whole point of a dice button is the half-second of not
  // knowing yet.
  let left = 9;
  const tumble = setInterval(() => {
    out.textContent = d(sides);
    if (--left) return;
    clearInterval(tumble);
    const got = d(sides);
    out.textContent = got;
    tile.classList.remove('rolling');
    tile.classList.add('settled');
    if (got === sides) tile.classList.add('nat20');
    if (got === 1) tile.classList.add('nat1');
    say(got === sides ? 'NAT ' + sides + '.'
        : got === 1 ? 'Critical fail.' : '', 4000);
  }, 55);
}

document.querySelectorAll('.tile').forEach(tile => {
  tile.onclick = () => {
    // A view swap is not a launch and not a link -- it is the drawer
    // opening. Kept as its own verb so `data-launch` stays exactly the
    // allowlisted-name-crosses-the-wire thing it has always been.
    const sides = tile.dataset.roll;
    if (sides) { roll(tile, parseInt(sides, 10)); return; }

    const view = tile.dataset.show;
    if (view) { grid.className = view; say(''); return; }

    const go = tile.dataset.go;
    if (go) { location.href = go; return; }

    const what = tile.dataset.launch;
    if (tile.classList.contains('busy')) return;
    tile.classList.add('busy');
    say('Starting ' + tile.querySelector('b').textContent + '...');

    fetch('launch/' + what, { method: 'POST' })
      .then(r => r.json())
      .then(r => {
        tile.classList.remove('busy');
        if (r.ok) {
          say(r.said || 'Started. Look at the screen.', 6000);
          if (r.open) location.href = r.open;
        } else {
          say(r.said || 'It would not start.', 9000);
        }
      })
      .catch(() => {
        tile.classList.remove('busy');
        say('No answer from the deck. Is ~/YUZU/face running?', 9000);
      });
  };
});
</script>
